async function descargarPlantilla(){try{const X=await cargarXLSX();const ws=X.utils.aoa_to_sheet(PLANT);ws['!cols']=[{wch:14},{wch:10},{wch:22},{wch:22},{wch:13},{wch:12},{wch:22},{wch:30}];const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Casas');const buf=X.write(wb,{type:'array',bookType:'xlsx'});await guardarArchivo('plantilla-casas-saldos.xlsx',new Blob([buf]))}
  catch(e){await guardarArchivo('plantilla-casas-saldos.csv','﻿'+PLANT.map(r=>r.map(c=>/[,"]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(',')).join('\r\n'))}}
function textoAFilas(t){const ls=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());const sep=ls.some(l=>l.includes('\t'))?'\t':ls.some(l=>l.includes(';'))?';':',';
  return ls.map(l=>{if(sep!==',')return l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim());const r=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===','&&!q){r.push(cur.trim());cur='';continue}cur+=ch}r.push(cur.trim());return r})}
function procesarFilas(filas){filas=filas.filter(r=>r.some(c=>String(c).trim()));const prev=document.getElementById('impPrev');if(!filas.length){prev.innerHTML=alertBox('bad','El archivo está vacío','');return}
  let ci={n:0,p:1,f:2,o:3,d:4,t:5,e:6,m:7},hayMeses=filas[0].length>7;const h=filas[0].map(x=>String(x).toLowerCase());
  if(h.some(x=>/n[uú]mero|casa|pol[ií]gono|familia|apellido|propietario|debe|mes/.test(x))){const fx=re=>h.findIndex(x=>re.test(x));ci={n:fx(/n[uú]mero|^casa|^no\.?$|^#/),p:fx(/pol[ií]gono|pasaje|bloque|sector/),f:fx(/familia|apellido/),o:fx(/propietario|due[nñ]o|nombre/),d:fx(/dui/),t:fx(/tel/),e:fx(/correo|email|e-mail/),m:fx(/debe|meses|mora|pendiente/)};if(ci.n<0)ci.n=0;hayMeses=ci.m>=0;filas=filas.slice(1)}
  const val=(r,i)=>i>=0?String(r[i]??'').trim():'';const vistos=new Set();const cuota=DB.config.cuota;
  IMP=filas.map((r,i)=>{const numero=val(r,ci.n).replace(/^casa\s*/i,''),pasaje=normPol(val(r,ci.p));const x={fila:i+1,numero,pasaje,familia:val(r,ci.f),prop:{nombre:val(r,ci.o),dui:val(r,ci.d),tel:val(r,ci.t),email:val(r,ci.e)},meses:null,est:'nueva',msg:''};
    if(hayMeses){const pm=parseMeses(val(r,ci.m));x.meses=pm.p;if(pm.err){x.est='error';x.msg=pm.err}}
    if(x.prop.dui&&!duiValido(x.prop.dui)){const d=x.prop.dui.replace(/\D/g,'');if(d.length===9)x.prop.dui=d.slice(0,8)+'-'+d[8];else{x.est='error';x.msg='DUI incompleto'}}
    const k=numero+'|'+pasaje.toLowerCase();
    if(x.est!=='error'){if(!numero){x.est='error';x.msg='Falta el número'}else if(!pasaje){x.est='error';x.msg='Falta el polígono'}else if(vistos.has(k)){x.est='error';x.msg='Repetida en el archivo'}
      else{const ex=DB.casas.find(c=>c.numero===numero&&c.pasaje.toLowerCase()===pasaje.toLowerCase());if(ex){x.ex=ex.id;const cambia=(x.familia&&x.familia!==ex.familia)||x.prop.nombre||x.meses;x.est=cambia?'actualiza':'existe';x.msg=cambia?'Ya existe · se actualizan sus datos':'Ya existe, sin cambios'}}}
    vistos.add(k);return x});
  const c=k=>IMP.filter(x=>x.est===k).length;const EST={nueva:['Nueva','ok'],actualiza:['Actualiza','info'],existe:['Sin cambios','mut'],error:['Error','bad']};
  const conM=IMP.filter(x=>x.est!=='error'&&x.meses);const deben=conM.filter(x=>x.meses.length);const tot=sum(deben,x=>x.meses.length*cuota);
  prev.innerHTML=`<h3>Revisión · ${IMP.length} fila(s)</h3><div class="months" style="margin-bottom:8px">${chip(c('nueva')+' nuevas','ok')}${c('actualiza')?chip(c('actualiza')+' actualizan','info'):''}${c('existe')?chip(c('existe')+' sin cambios','mut'):''}${c('error')?chip(c('error')+' con error','bad'):''}</div>
  ${hayMeses?`<div class="card kv"><span>Casas solventes</span><b>${conM.length-deben.length}</b><span>Casas con mora</span><b>${deben.length}</b><span>Total adeudado</span><b>${money(tot)} <span class="sm muted">(sin recargos)</span></b></div>`:alertBox('info','El archivo no trae la columna “Meses que debe”','Las cuotas no se modifican; solo se cargan casas y propietarios.')}
  <div class="card" style="max-height:320px;overflow:auto;padding:4px 14px">${IMP.slice(0,400).map(x=>`<div class="chk"><span class="grow"><b>Casa ${esc(x.numero||'?')}</b> <span class="sm muted">· ${esc(x.pasaje||'sin polígono')}${x.familia?' · Fam. '+esc(x.familia):''}</span>${x.prop.nombre?`<div class="sm">${esc(x.prop.nombre)}${x.prop.tel?' · '+esc(x.prop.tel):''}</div>`:''}${x.meses?`<div class="sm" style="color:var(${x.meses.length?'--bad':'--ok'})">${x.meses.length?'Debe '+x.meses.length+' mes(es): '+esc(x.meses.map(perC).join(', '))+' · '+money(x.meses.length*cuota):'Solvente'}</div>`:''}${x.msg?`<div class="sm muted">Fila ${x.fila}: ${esc(x.msg)}</div>`:''}</span>${chip(EST[x.est][0],EST[x.est][1])}</div>`).join('')}</div>
  ${c('nueva')+c('actualiza')?`<button class="btn ok block big-ok" onclick="confirmarImport()">Importar ${c('nueva')} nueva(s)${c('actualiza')?' y actualizar '+c('actualiza'):''}</button>`:alertBox('warn','No hay cambios para importar','')}${c('error')?'<p class="note">Las filas con error no se importan. Corrígelas y vuelve a subir el archivo.</p>':''}`}
function confirmarImport(){if(!IMP)return;const per=periodoActual();const desde=ymd()<=vence(per)?per:addMonths(per,1);let n=0,u=0;
  IMP.forEach(x=>{if(x.est!=='nueva'&&x.est!=='actualiza')return;let c;
    if(x.est==='nueva'){c={id:'c'+uid(),numero:x.numero,pasaje:x.pasaje,familia:x.familia,duenoId:null,codigo:genCodigo(),desde:x.meses&&x.meses.length?x.meses[0]:desde};DB.casas.push(c);n++}else{c=casa(x.ex);if(x.familia)c.familia=x.familia;u++}
    if(x.prop.nombre)c.prop=Object.assign({},c.prop||{},Object.fromEntries(Object.entries(x.prop).filter(([,v])=>v)));
    if(x.meses)aplicarSaldo(c,x.meses)});
  IMP=null;ensureCuotas();save();closeSheet();S.cf='todas';render();toast(`${n} casa(s) nuevas${u?' · '+u+' actualizadas':''}. Saldos aplicados.`)}
/* Editar en la app los meses que debe una casa */
function editarSaldo(cid){const c=casa(cid),per=periodoActual();const ini=c.desde||DB.inicioCobro;const ops=new Set([...Array(36)].map((_,i)=>addMonths(per,-i)));ops.add(ini);
  sheet('Meses pendientes · '+casaNom(cid),`<p class="note" style="margin-top:0">Marca los meses que debe esta casa; los no marcados quedan como pagados. Cuota: ${money(DB.config.cuota)}${DB.config.recargo?', más recargo de '+money(DB.config.recargo)+' por mes vencido':''}.</p>
  <label class="f">Cobrar desde<select id="salDesde" onchange="pintarSaldo('${cid}')">${[...ops].sort().reverse().map(p=>`<option value="${p}" ${p===ini?'selected':''}>${perL(p)}</option>`).join('')}</select></label>

function pintarSaldo(cid,primera){const per=periodoActual(),desde=document.getElementById('salDesde').value;const prevSel=primera?null:new Set([...document.querySelectorAll('#salList [name=sal]:checked')].map(x=>x.value));const qs=cuotasCasa(cid);let h='',p=desde,g=0;const ms=[];while(p<=per&&g<240){ms.push(p);p=addMonths(p,1);g++}
  document.getElementById('salList').innerHTML=ms.reverse().map(m=>{const q=qs.find(x=>x.periodo===m);if(q&&q.estado==='revision')return `<div class="chk"><span style="width:22px">⏳</span><span class="grow">${perL(m)}</span>${chip('En revisión','info')}</div>`;const ck=prevSel?prevSel.has(m):(q?q.estado==='pendiente':false);return `<label class="chk"><input type="checkbox" name="sal" value="${m}" ${ck?'checked':''} onchange="totSaldo()"><span class="grow">${perL(m)}</span><span class="sm muted">${ck?'Debe':'Pagado'}</span></label>`}).join('');totSaldo()}
function totSaldo(){const ls=[...document.querySelectorAll('#salList [name=sal]')];ls.forEach(x=>{x.parentElement.querySelector('.sm').textContent=x.checked?'Debe':'Pagado'});const n=ls.filter(x=>x.checked).length;document.getElementById('salTot').textContent=money(n*DB.config.cuota)+' ('+n+')'}
function marcarSaldo(cid,v){document.querySelectorAll('#salList [name=sal]').forEach(x=>x.checked=v);totSaldo()}
function guardarSaldo(cid){const c=casa(cid);const desde=document.getElementById('salDesde').value;const owed=[...document.querySelectorAll('#salList [name=sal]:checked')].map(x=>x.value).sort();
  c.desde=desde;DB.cuotas=DB.cuotas.filter(q=>!(q.casaId===cid&&q.periodo<desde&&q.estado!=='pagado'));aplicarSaldo(c,owed);save();closeSheet();render();toast(owed.length?`Guardado: debe ${owed.length} mes(es)`:'Guardado: casa al día')}
function editarProp(cid){const c=casa(cid),p=c.prop||{};sheet('Datos del propietario',`<p class="note" style="margin-top:0">Datos de referencia del propietario (aún sin cuenta en la app).</p><form onsubmit="guardarProp(event,'${cid}')"><label class="f">Nombre<input name="nombre" required value="${esc(p.nombre||'')}"></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off" value="${esc(p.dui||'')}"></label><label class="f">Teléfono<input name="tel" inputmode="tel" value="${esc(p.tel||'')}"></label></div><label class="f">Correo<input name="email" type="email" value="${esc(p.email||'')}"></label><button class="btn block">Guardar</button></form>`)}

function nuevoAdminUser(){sheet('Nuevo usuario de administración',`<p class="note" style="margin-top:0">Tendrá acceso completo a la administración de esta residencial: casas, pagos, avisos, accesos y personal.</p><form onsubmit="crearUsuario(event,'admin')"><label class="f">Nombre<input name="nombre" required></label><label class="f">Cargo<select name="cargo">${Object.values(CARGOS).flat().filter(c=>c!=='Otro').map(c=>`<option>${c}</option>`).join('')}</select></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Teléfono<input name="tel" inputmode="tel"></label></div><div class="two"><label class="f">Usuario<input name="user" required autocapitalize="none"></label><label class="f">Contraseña<input name="pass" required minlength="4"></label></div><button class="btn block">Crear usuario</button></form>`)}

function guardarDueno(e,cid){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const un=g('user').toLowerCase();
  if(!duiValido(g('dui')))return toast('DUI incompleto. Formato: 00000000-0');if(DB.usuarios.some(u=>u.user.toLowerCase()===un))return toast('Ese usuario ya existe, elige otro');
  const c=casa(cid);const u={id:'u_'+uid(),rol:'residente',nombre:g('nombre'),user:un,pass:g('pass'),casaId:cid,tel:g('tel'),email:g('email'),dui:g('dui'),activo:true};DB.usuarios.push(u);c.duenoId=u.id;if(g('familia'))c.familia=g('familia');c.codigo=genCodigo();save();render();

function loginRol(rol){if(rol!=='superadmin'&&!DB)return toast('Primero el Administrador de la APP debe registrar una residencial');

function loginRolOk(e,rol){e.preventDefault();const f=new FormData(e.target);const un=String(f.get('user')).trim().toLowerCase(),pw=f.get('pass');
  if(rol==='superadmin'){const sa=PLAT.superadmins.find(x=>x.user===un&&x.pass===pw);if(!sa)return toast('Usuario o clave incorrectos');closeSheet();return entrar(sa)}
  const u=DB.usuarios.find(x=>x.user.toLowerCase()===un&&x.pass===pw);if(!u)return toast('Usuario o clave incorrectos para '+DB.residencial.nombre);
  if(u.rol!==rol)return toast('Ese usuario es de '+ROL[u.rol].toLowerCase()+', no de '+ROL[rol].toLowerCase());closeSheet();entrar(u)}

const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function filtraRes(q){const box=document.getElementById('resList');if(!box)return;const n=normTxt(q);
  const res=PLAT.residenciales.map(r=>{const nm=normTxt(r.nombre);const pal=nm.split(/\s+/);const rank=!n?2:nm.startsWith(n)?0:pal.some(w=>w.startsWith(n))?1:-1;return{r,rank}}).filter(x=>x.rank>=0).sort((a,b)=>a.rank-b.rank||a.r.nombre.localeCompare(b.r.nombre)).slice(0,8);
  const appOk=!n||normTxt('Administrador de la APP').split(' ').some(w=>w.startsWith(n))||normTxt('Administrador de la APP').startsWith(n);
  box.innerHTML=res.map(x=>`<button type="button" class="combo-it" onmousedown="event.preventDefault();elegirRes('${x.r.id}')">${ic('houses',16)} <span>${esc(x.r.nombre)}</span><small>${esc(x.r.municipio||'')}</small></button>`).join('')+(appOk?`<button type="button" class="combo-it" onmousedown="event.preventDefault();elegirRes('plat')">⚙️ <span>Administrador de la APP</span></button>`:'')+(!res.length&&!appOk?'<div class="empty" style="padding:12px">Sin coincidencias</div>':'');
  box.hidden=false}
function elegirRes(id){const box=document.getElementById('resList');if(box)box.hidden=true;cambiarRes(id);setTimeout(()=>{const u=document.querySelector('.login [name=user]');if(u)u.focus()},30)}
function teclaRes(e){if(e.key==='Enter'){e.preventDefault();const b=document.querySelector('#resList .combo-it');if(b)b.dispatchEvent(new MouseEvent('mousedown'))}else if(e.key==='Escape'){document.getElementById('resList').hidden=true}}

function dirDB(){if(!DB.directorio)DB.directorio={emergencia:[],servicios:[]};return DB.directorio}
function seedDirectorio(d,ejemplo){const r=d.residencial;const em=[{id:uid(),categoria:'Emergencias (911)',nombre:'Emergencias',telefono:'911',nota:''}];
  if(r.vigilancia&&r.vigilancia.telefono)em.push({id:uid(),categoria:'Caseta / Portería',nombre:'Portería principal',telefono:r.vigilancia.telefono,nota:'24 horas'});
  const ad=(r.equipo||[]).find(m=>m.cargo==='Administrador(a)');if(ad&&ad.telefono)em.push({id:uid(),categoria:'Administración',nombre:ad.nombre,telefono:ad.telefono,nota:''});
  const sv=ejemplo?[{id:uid(),nombre:'Ramón Castillo',oficio:'Plomero',telefono:'7123-1111',dui:'04567123-4',zona:'Lun–Sáb 7:00–17:00',nota:'Ha trabajado en la residencial desde 2022.',verificado:true,solvencia:true,fecha:ymd(),foto:null},{id:uid(),nombre:'Carmen Alas',oficio:'Empleada de casa',telefono:'7222-3333',dui:'05678234-5',zona:'Por día o permanente',nota:'Referencias de 3 familias de la residencial.',verificado:true,solvencia:true,fecha:ymd(),foto:null},{id:uid(),nombre:'Electro Servicios Ayala',oficio:'Electricista',telefono:'7333-4444',dui:'',zona:'Emergencias 24 h',nota:'',verificado:false,solvencia:false,fecha:ymd(),foto:null}]:[];
  d.directorio={emergencia:em,servicios:sv}}
function telRow(t){const n=String(t||'').replace(/[^\d+]/g,'');return `<a class="btn smb sec" href="tel:${esc(n)}">${ic('phone',14)} ${esc(t)}</a>`}
function vDirectorio(){const adm=S.user.rol==='admin';const D=dirDB();S.dseg=S.dseg||'emergencia';
  let h=`<h2>Directorio</h2>${seg('dseg',[['emergencia','🚨 Emergencias'],['servicios','🛠️ Servicios de confianza']])}`;
  if(S.dseg==='emergencia'){h+=`<p class="note" style="margin-top:-4px">Números importantes de la residencial y de emergencia.${adm?' Agrega o corrige los que necesites.':''}</p>`+(D.emergencia.slice().sort((a,b)=>CAT_EM.indexOf(a.categoria)-CAT_EM.indexOf(b.categoria)).map(e=>`<div class="item"><div class="av">${/911|Polic|Bomb|Ambul|Civil/.test(e.categoria)?'🚨':'📞'}</div><div class="grow"><b>${esc(e.nombre)}</b><div class="sm muted">${esc(e.categoria)}${e.nota?' · '+esc(e.nota):''}</div><div style="margin-top:6px">${telRow(e.telefono)}</div></div>${adm?`<button class="btn smb ghost" onclick="editarEm('${e.id}')">Editar</button>`:''}</div>`).join('')||empty('Sin números registrados'))+(adm?`<button class="btn block" onclick="editarEm()">${ic('plus',18)} Agregar número</button>`:'')}
  else{S.dof=S.dof||'';const ofs=[...new Set(D.servicios.map(s=>s.oficio))];const l=D.servicios.filter(s=>(adm||s.activo!==false)&&(!S.dof||s.oficio===S.dof)).sort((a,b)=>(S.dord==='rating'?scoreR('serv',b.id)-scoreR('serv',a.id):0)||(b.verificado?1:0)-(a.verificado?1:0)||a.nombre.localeCompare(b.nombre));
    h+=`<p class="note" style="margin-top:-4px">Personas y empresas revisadas por la administración.${adm?' Tú decides quién aparece aquí.':' Contáctalas directamente.'}</p>${ofs.length>1?`<div class="months" style="margin-bottom:10px"><button class="chip ${!S.dof?'info':''}" style="border:0" onclick="S.dof='';render()">Todos</button>${ofs.map(o=>`<button class="chip ${S.dof===o?'info':''}" style="border:0" onclick="S.dof='${esc(o)}';render()">${esc(o)}</button>`).join('')}</div>`:''}`+(l.length>1?ordenBar('dord'):'')+(l.map(s=>servCard(s,adm)).join('')||empty('Aún no hay servicios registrados'))+(adm?`<button class="btn block" onclick="editarServ()">${ic('plus',18)} Agregar persona o empresa</button>`:'')}
  return h}
function servCard(s,adm){const ini=s.nombre.split(' ').map(w=>w[0]).slice(0,2).join('');const tel=String(s.telefono||'').replace(/\D/g,'');
  return `<div class="card"><div class="row">${s.foto&&s.foto.data?`<img src="${s.foto.data}" alt="" style="width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none">`:`<div class="av" style="width:52px;height:52px;border-radius:50%">${esc(ini)}</div>`}<div class="grow"><b>${esc(s.nombre)}</b><div class="sm muted">${esc(s.oficio)}${s.zona?' · '+esc(s.zona):''}</div><div class="months">${s.verificado?chip('✓ Verificado por la administración','ok'):chip('Sin verificar','warn')}${solvChip(s)}${adm&&s.activo===false?chip('Oculto','mut'):''}</div><div style="margin-top:6px">${rateLine('serv',s.id,true)}</div></div></div>${s.nota?`<p class="sm" style="margin:8px 0 0">${esc(s.nota)}</p>`:''}
  <div class="btns">${telRow(s.telefono)}<button class="btn smb ghost" onclick="verResenas('serv','${s.id}')">${ic('star',14)} ${['residente','inquilino'].includes(S.user.rol)?'Opiniones y calificar':'Opiniones'}</button>${tel?`<a class="btn smb ghost" target="_blank" rel="noopener" href="https://wa.me/${tel.length<=8?telCode()+tel:tel}">WhatsApp</a>`:''}${['residente','inquilino'].includes(S.user.rol)?`<button class="btn smb ghost" onclick="paseDesdeServ('${s.id}')">Crear pase</button>`:''}${adm&&s.solvDoc?`<button class="btn smb ghost" onclick="verSolv('${s.id}')">Solvencia</button>`:''}${adm?`<button class="btn smb ghost" onclick="editarServ('${s.id}')">Editar</button>`:''}</div></div>`}
function editarEm(id){const e=id?dirDB().emergencia.find(x=>x.id===id):{};sheet(id?'Editar número':'Nuevo número',`<form onsubmit="guardarEm(event,'${id||''}')"><label class="f">Tipo<select name="categoria">${CAT_EM.map(c=>`<option ${e.categoria===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="f">Nombre<input name="nombre" required value="${esc(e.nombre||'')}" placeholder="Ej. Delegación PNC Santa Tecla"></label><label class="f">Teléfono<input name="telefono" required inputmode="tel" value="${esc(e.telefono||'')}"></label><label class="f">Nota (opcional)<input name="nota" value="${esc(e.nota||'')}" placeholder="Ej. 24 horas"></label><button class="btn block">Guardar</button>${id?`<button type="button" class="btn bad block" onclick="borrarDir('emergencia','${id}')">Eliminar</button>`:''}</form>`)}
function guardarEm(e,id){e.preventDefault();const f=new FormData(e.target);const o={categoria:f.get('categoria'),nombre:String(f.get('nombre')).trim(),telefono:String(f.get('telefono')).trim(),nota:String(f.get('nota')||'').trim()};const L=dirDB().emergencia;if(id)Object.assign(L.find(x=>x.id===id),o);else L.push(Object.assign({id:uid()},o));save();closeSheet();render();toast('Número guardado')}
function editarServ(id){const s=id?dirDB().servicios.find(x=>x.id===id):{verificado:true,activo:true};SERVFOTO=undefined;SERVSOLV=undefined;
  sheet(id?'Editar perfil':'Nuevo perfil de servicio',`<p class="note" style="margin-top:0">Este perfil no da acceso a la administración; solo aparece en el directorio para los residentes.</p><form onsubmit="guardarServ(event,'${id||''}')"><label class="f">Nombre o empresa<input name="nombre" required value="${esc(s.nombre||'')}"></label><label class="f">Oficio<select name="oficio">${OFICIOS_S.map(o=>`<option ${s.oficio===o?'selected':''}>${o}</option>`).join('')}</select></label><div class="two"><label class="f">Teléfono<input name="telefono" required inputmode="tel" value="${esc(s.telefono||'')}"></label><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off" value="${esc(s.dui||'')}"></label></div><label class="f">Horario / zona<input name="zona" value="${esc(s.zona||'')}" placeholder="Ej. Lun–Sáb 7:00–17:00"></label><label class="f">Referencias o nota<textarea name="nota" placeholder="Ej. Recomendado por la casa 12">${esc(s.nota||'')}</textarea></label><label class="f">Foto (opcional)<input type="file" accept="image/*" onchange="fotoServ(this)"></label>
  <label class="chk"><input type="checkbox" name="verificado" ${s.verificado?'checked':''}><span class="grow sm">Verificado por la administración (documentos y referencias revisados)</span></label><label class="chk"><input type="checkbox" name="solvencia" ${s.solvencia?'checked':''}><span class="grow sm">Presentó solvencia de la PNC</span></label><label class="f" style="margin-top:10px">Solvencia policial (foto o PDF)<input type="file" accept="image/*,application/pdf" onchange="solvServ(this)"></label>${s.solvDoc?`<button type="button" class="btn ghost smb" style="margin:-4px 0 10px" onclick="verSolv('${s.id}')">${ic('doc',14)} Ver solvencia guardada</button>`:''}<label class="f">Solvencia vigente hasta (opcional)<input type="date" name="solvVence" value="${esc(s.solvVence||'')}"></label><label class="chk"><input type="checkbox" name="activo" ${s.activo!==false?'checked':''}><span class="grow sm">Visible para los residentes</span></label>
  <button class="btn block">Guardar perfil</button>${id?`<button type="button" class="btn bad block" onclick="borrarDir('servicios','${id}')">Eliminar perfil</button>`:''}</form>`)}
let SERVFOTO;async function fotoServ(inp){try{SERVFOTO=await leerArchivo(inp.files[0])}catch(e){toast('Foto no válida')}}
function guardarServ(e,id){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();if(!duiOk(g('dui')))return toast('DUI incompleto. Formato: 00000000-0');
  const o={nombre:g('nombre'),oficio:g('oficio'),telefono:g('telefono'),dui:g('dui'),zona:g('zona'),nota:g('nota'),verificado:!!f.get('verificado'),solvencia:!!f.get('solvencia'),activo:!!f.get('activo'),fecha:ymd()};if(SERVFOTO)o.foto=SERVFOTO;if(SERVSOLV){o.solvDoc=SERVSOLV;o.solvencia=true}o.solvVence=g('solvVence');
  const L=dirDB().servicios;if(id)Object.assign(L.find(x=>x.id===id),o);else{L.push(Object.assign({id:uid(),foto:null},o));if(o.activo)notificar(DB.usuarios.filter(u=>u.activo&&['residente','inquilino'].includes(u.rol)).map(u=>u.id),'🛠️ Nuevo servicio de confianza',`${o.nombre} · ${o.oficio}`,{tab:'directorio'})}
  SERVFOTO=undefined;SERVSOLV=undefined;save();closeSheet();render();toast('Perfil guardado')}
function borrarDir(k,id){dirDB()[k]=dirDB()[k].filter(x=>x.id!==id);save();closeSheet();render();toast('Eliminado')}
function paseDesdeServ(id){const s=dirDB().servicios.find(x=>x.id===id);nuevoPase('personal');setTimeout(()=>{const o=document.querySelector('#ov');if(!o)return;const set=(n,v)=>{const i=o.querySelector('[name='+n+']');if(i&&v)i.value=v};set('nombre',s.nombre);set('dui',s.dui);const sel=o.querySelector('[name=detalle]');if(sel){const m=[...sel.options].find(x=>normTxt(x.value).startsWith(normTxt(s.oficio).slice(0,5)));if(m)sel.value=m.value}},30)}

function trS(s){if(LANG!=='en'&&!esCondo()&&paisRes()==='SV')return s;const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);let t=m[2];if(!t)return s;
  if(LANG==='en')t=trEN(t);
  if(esCondo())for(const[re,rep]of(LANG==='en'?TERM_EN:TERM_ES))t=t.replace(re,rep);
  if(paisRes()!=='SV')t=t.replace(/\bDUI\b/g,LANG==='en'&&paisCfg().id==='DUI'?'ID':paisCfg().id).replace(/00000000-0/g,'');
  return m[1]+t+m[3]}
function trNodo(root){if(LANG!=='en'&&!esCondo()&&paisRes()==='SV')return;if(!root)return;if(root.nodeType===3){const v=trS(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return}if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const v=trS(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  (root.querySelectorAll?[root,...root.querySelectorAll('[placeholder],[aria-label],[title]')]:[]).forEach(el=>{['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const t=trS(v);if(t!==v)el.setAttribute(a,t)}})})}
new MutationObserver(ms=>{if(LANG!=='en'&&!esCondo()&&paisRes()==='SV')return;ms.forEach(m=>m.addedNodes.forEach(trNodo))}).observe(document.body,{childList:true,subtree:true});

function trEN(t){if(t.includes(' · ')){const ps=t.split(' · ');const tp=ps.map(trSeg);if(tp.some((x,i)=>x!==ps[i]))return tp.join(' · ')}let r=trSeg(t);if(r!==t)return r;const d=t.match(/^(.+?)([.:!?])$/);if(d){const x=trSeg(d[1]);if(x!==d[1])return x+d[2]}return t}

function enviarPedido(e){e.preventDefault();const f=new FormData(e.target);const it=cartItems();if(!it.length)return;const v=usuario(S.cart.v);const T=tiendaDB();const ent=f.get('entrega');const sub=sum(it,x=>x.precio*x.cant);const env=ent==='domicilio'?(v.envio||0):0;
  const p={id:uid(),num:(T.seq=(T.seq||0)+1),compradorId:S.user.id,casaId:S.user.casaId,vendedorId:v.id,items:it,subtotal:sub,envio:env,total:sub+env,entrega:ent,referencia:String(f.get('ref')||'').trim(),pago:f.get('pago'),nota:String(f.get('nota')||'').trim(),estado:'nuevo',fecha:nowISO(),confV:false,confC:false,chat:[],visto:{}};

function noLeidos(p){const n=(p.chat||[]).length,s=(p.visto||{})[S.user.id]||0;return Math.max(0,n-s)}

  return `<button class="item" onclick="verPedido('${p.id}')">${rol==='comprador'&&v&&v.logo?logoImg(v.logo,42,'50%'):`<div class="av">${p.entrega==='domicilio'?'🛵':'🏠'}</div>`}<div class="grow"><b>${numPed(p)} · ${esc(rol==='comprador'?(v?v.negocio:''):casaNom(p.casaId)+' · '+(c?c.nombre:''))}</b><div class="sm muted">${p.items.map(i=>i.cant+'× '+i.nombre).join(', ')}</div><div class="sm">${money(p.total)} · ${fFecha(p.fecha)}</div></div><div class="right">${chip(e.l,e.c)}${nl?`<div style="margin-top:4px">${chip('💬 '+nl,'bad')}</div>`:''}</div></button>`}
function verPedido(id){const p=pedido(id);if(!p)return;const soyV=S.user.id===p.vendedorId,soyC=p.casaId===S.user.casaId&&!soyV;const adm=S.user.rol==='admin';const v=usuario(p.vendedorId),c=usuario(p.compradorId),cs=casa(p.casaId);const e=EST_PED[p.estado];const nl=noLeidos(p);
  const fin=['entregado','rechazado','cancelado'].includes(p.estado);let acc='';
  if(soyV&&p.estado==='nuevo')acc=`<button class="btn ok" onclick="estadoPed('${id}','aceptado')">Aceptar pedido</button><button class="btn bad" onclick="estadoPed('${id}','rechazado')">Rechazar</button>`;
  if(soyV&&p.estado==='aceptado')acc=p.entrega==='domicilio'?`<button class="btn" onclick="estadoPed('${id}','en_camino')">🛵 Salió a entregar</button>`:`<button class="btn" onclick="estadoPed('${id}','listo')">🏠 Listo para retirar</button>`;
  if(soyC&&p.estado==='nuevo')acc=`<button class="btn ghost" onclick="estadoPed('${id}','cancelado')">Cancelar pedido</button>`;
  const puedeConf=['aceptado','listo','en_camino'].includes(p.estado);
  const conf=puedeConf&&(soyV||soyC)?`<div class="card" style="border:2px solid var(--ok)"><b>Confirmar entrega</b><p class="sm muted" style="margin:4px 0 8px">El pedido queda entregado cuando vendedor y comprador confirman.</p><div class="months">${chip((p.confV?'✓ ':'… ')+'Vendedor',p.confV?'ok':'mut')}${chip((p.confC?'✓ ':'… ')+'Comprador',p.confC?'ok':'mut')}</div>${(soyV&&!p.confV)||(soyC&&!p.confC)?`<button class="btn ok block big-ok" onclick="confirmarEntrega('${id}')">${ic('check',20)} ${soyV?'Entregué el pedido':'Recibí mi pedido'}</button>`:`<p class="sm" style="margin:8px 0 0">Esperando la confirmación de ${soyV?'el comprador':'el vendedor'}.</p>`}</div>`:'';
  const tel=x=>x&&x.tel?telRow(x.tel):'';
  sheet('Pedido '+numPed(p),`<div class="row" style="margin-bottom:10px">${chip(e.l,e.c)}<span class="grow"></span><span class="sm muted">${fFecha(p.fecha)}</span></div>
  <div class="card">${p.items.map(i=>`<div class="chk"><span class="grow">${i.cant} × ${esc(i.nombre)}</span><b>${money(i.precio*i.cant)}</b></div>`).join('')}${p.envio?`<div class="chk"><span class="grow">Envío</span><b>${money(p.envio)}</b></div>`:''}<div class="chk"><b class="grow">Total</b><b style="font-size:18px">${money(p.total)}</b></div></div>
  <div class="kv sm" style="margin-bottom:12px"><span>Entrega</span><b>${p.entrega==='domicilio'?'🛵 A domicilio':'🏠 Retiro en '+esc(v&&v.direccion||'casa del vendedor')}</b>${p.entrega==='domicilio'?`<span>Dirección</span><b>${casaNom(p.casaId)} · ${esc(cs?casaDesc(cs):'')}${p.referencia?'<br>'+esc(p.referencia):''}</b>`:''}<span>Pago</span><b>${PAGO_T[p.pago]||''}</b>${p.nota?`<span>Nota</span><b>${esc(p.nota)}</b>`:''}<span>${soyV||adm?'Cliente':'Tienda'}</span><b>${soyV||adm?esc(c?c.nombre:'')+' · '+casaNom(p.casaId):esc(v?v.negocio+' · '+v.nombre:'')}</b></div>
  <div class="btns" style="margin-top:0">${(soyV||adm)&&c?tel(c):''}${soyC&&v?tel(v):''}${!fin||p.chat.length?`<button class="btn sec" onclick="abrirChat('${id}')">💬 Chat${nl?' ('+nl+')':''}</button>`:''}</div>
  ${acc?`<div class="btns">${acc}</div>`:''}${conf}${p.estado==='entregado'&&soyC&&['residente','inquilino'].includes(S.user.rol)?invitaCalif(p):''}`)}
function estadoPed(id,est){const p=pedido(id);const v=usuario(p.vendedorId);p.estado=est;p['f_'+est]=nowISO();
  const msg={aceptado:'aceptó tu pedido',rechazado:'no puede atender tu pedido',en_camino:'salió a entregar tu pedido',listo:'tu pedido está listo para retirar',cancelado:'canceló el pedido'}[est];
  if(est==='cancelado')notificar([p.vendedorId],'Pedido '+numPed(p)+' cancelado',casaNom(p.casaId)+' canceló el pedido.',{tipo:'pedido',id});
  else notificar([p.compradorId],(est==='rechazado'?'❌ ':'🛍️ ')+v.negocio,`${est==='listo'?'Tu pedido '+numPed(p)+' está listo para retirar en '+(v.direccion||'casa del vendedor'):v.negocio+' '+msg+' '+numPed(p)}`,{tipo:'pedido',id});
  if(est==='en_camino'&&p.entrega==='domicilio'&&!v.casaId){const pa={id:uid(),casaId:p.casaId,creadoPor:p.compradorId,tipo:'entrega',nombre:v.nombre+' · '+v.negocio,dui:'',detalle:'Pedido '+numPed(p)+' (Tienda GateWise)',placa:'',horario:'',desde:ymd(),hasta:ymd(),pin:genPin(),estado:'activo',ingresos:[],porton:portonDe('entrega')};DB.pases.push(pa);notificar(vigilantes(),'🛵 Entrega en camino',`${pa.nombre} → ${casaNom(p.casaId)} · pase automático`,{tab:'inicio'})}

function confirmarEntrega(id){const p=pedido(id);const soyV=S.user.id===p.vendedorId;if(soyV)p.confV=true;else p.confC=true;
  const otro=soyV?p.compradorId:p.vendedorId;if(p.confV&&p.confC){p.estado='entregado';p.f_entregado=nowISO();notificar([otro],'✅ Pedido '+numPed(p)+' entregado','Vendedor y comprador confirmaron la entrega.',{tipo:'pedido',id})}

function enviarMsg(id,txt){const i=document.getElementById('chatIn');const t=String(txt||(i&&i.value)||'').trim();if(!t)return;const p=pedido(id);p.chat.push({autor:S.user.id,texto:t,fecha:nowISO()});p.visto=p.visto||{};p.visto[S.user.id]=p.chat.length;

function vVenInicio(){const v=S.user;const ps=tiendaDB().pedidos.filter(p=>p.vendedorId===v.id);const hoy=ymd(),mes=periodoActual();const ent=ps.filter(p=>p.estado==='entregado');

function guardarProd(e,id){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const o={nombre:g('nombre'),descripcion:g('descripcion'),precio:Math.round(+g('precio')*100)/100,categoria:g('categoria')||'Otro',activo:!!f.get('activo')};if(PRODFOTO)o.foto=PRODFOTO;
  const T=tiendaDB();if(id)Object.assign(prod(id),o);else{T.productos.push(Object.assign({id:uid(),vendedorId:S.user.id,foto:null,fecha:ymd()},o))}PRODFOTO=undefined;save();closeSheet();render();toast(id?'Producto actualizado':'Producto publicado')}
function toggleProd(id){const p=prod(id);p.activo=!p.activo;save();render()}
function borrarProd(id){const T=tiendaDB();T.productos=T.productos.filter(p=>p.id!==id);save();closeSheet();render();toast('Producto eliminado')}

function crearVendedor(e){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const un=g('user').toLowerCase();if(DB.usuarios.some(u=>u.user.toLowerCase()===un))return toast('Ese usuario ya existe');const o=leerNegocio(f);if(o.err)return toast(o.err);
  const c=g('casa');if(c&&!o.direccion)o.direccion=casaNom(c)+', '+casa(c).pasaje;
  const u=Object.assign({id:'u_'+uid(),rol:'vendedor',nombre:g('nombre'),tel:g('tel'),user:un,pass:g('pass'),casaId:c,activo:true},o);DB.usuarios.push(u);
  notificar(DB.usuarios.filter(x=>x.activo&&['residente','inquilino'].includes(x.rol)).map(x=>x.id),'🛍️ Nueva tienda: '+u.negocio,u.categoria+(u.domicilio?' · entrega a domicilio':''),{tab:'tienda'});save();closeSheet();render();
  sheet('Vendedor creado',`<p>Entrega estos datos a <b>${esc(u.nombre)}</b>:</p><div class="card kv"><span>Residencial</span><b>${esc(DB.residencial.nombre)}</b><span>Usuario</span><b>${esc(un)}</b><span>Clave</span><b>${esc(u.pass)}</b></div><p class="note">Entra en la pantalla de inicio eligiendo la residencial. Desde su panel publica productos y atiende pedidos.</p><button class="btn block" onclick="closeSheet()">Listo</button>`)}

const PALETA=[['#0f766e','Verde GateWise'],['#166534','Verde bosque'],['#1d4ed8','Azul'],['#1e3a8a','Azul marino'],['#0369a1','Celeste'],['#6d28d9','Morado'],['#9f1239','Vino'],['#b91c1c','Rojo'],['#c2410c','Naranja'],['#a16207','Dorado'],['#334155','Gris pizarra'],['#111827','Negro']];
const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]};
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mezcla=(a,b,t)=>{const x=hexRgb(a),y=hexRgb(b);return rgbHex(x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t)};
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const sobre=h=>lum(h)>.42?'#111827':'#ffffff';
function claro(h){let c=h;for(let i=0;i<8&&lum(c)<.32;i++)c=mezcla(c,'#ffffff',.22);return c}
const esOscuro=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)};
function marcaActual(){if(S.mk&&S.tab==='residencial'&&S.rtab==='marca')return S.mk;if(S.user&&S.user.rol==='superadmin')return null;if(!S.user&&(S.modoPlat||!PLAT||!PLAT.residenciales.length))return null;return DB&&DB.residencial&&DB.residencial.marca||null}
const marcaPri=()=>{const m=marcaActual();return m&&m.pri||'#0f766e'};
function aplicarMarca(){const r=document.documentElement.style;const m=marcaActual();const keys=['--pri','--onpri','--pri2','--bar','--onbar'];
  if(!m||!m.pri){keys.forEach(k=>r.removeProperty(k));setThemeMeta('#0f766e');return}
  const dk=esOscuro();const pri=dk?claro(m.pri):m.pri;const bar=m.bar||m.pri;const barV=dk?mezcla(bar,'#0b1218',.35):bar;
  r.setProperty('--pri',pri);r.setProperty('--onpri',sobre(pri));r.setProperty('--pri2',dk?mezcla(pri,'#141e27',.72):mezcla(m.pri,'#ffffff',.86));r.setProperty('--bar',barV);r.setProperty('--onbar',sobre(barV));setThemeMeta(barV)}
function setThemeMeta(c){let t=document.querySelector('meta[name=theme-color]');if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}t.content=c}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>aplicarMarca())}catch(e){}
function leerLogo(file,max=360){return new Promise((res,rej)=>{if(!file||!file.size)return res(null);if(!file.type.startsWith('image/'))return rej(new Error('tipo'));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);const png=c.toDataURL('image/png');
    const j=document.createElement('canvas');j.width=w;j.height=h;const y=j.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,w,h);y.drawImage(img,0,0,w,h);res({tipo:'img',nombre:'logo.png',data:png.length<260000?png:c.toDataURL('image/jpeg',.85),jpg:j.toDataURL('image/jpeg',.88),w,h})};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function genLogo(ini,bg,fg='#fff'){const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');x.fillStyle=bg;x.beginPath();x.arc(120,120,120,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=8;x.beginPath();x.arc(120,120,100,0,7);x.stroke();x.fillStyle=fg;x.font='bold 92px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ini,120,128);
  const j=document.createElement('canvas');j.width=j.height=240;const y=j.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,240,240);y.drawImage(c,0,0);return{tipo:'img',nombre:'logo.png',data:c.toDataURL('image/png'),jpg:j.toDataURL('image/jpeg',.88),w:240,h:240}}
const logoImg=(l,s=34,r='10px',extra='')=>l&&l.data?`<img src="${l.data}" alt="" style="width:${s}px;height:${s}px;border-radius:${r};object-fit:contain;background:#fff;flex:none;${extra}">`:'';

function resMarca(){const R=DB.residencial;if(!S.mk)S.mk=Object.assign({pri:'#0f766e',bar:'',logo:null},R.marca||{});const m=S.mk;const bar=m.bar||m.pri;

  <h3>Logo de la residencial</h3><div class="card"><div class="row">${logoImg(m.logo,72,'16px')||`<div class="av" style="width:72px;height:72px">${ic('houses',30)}</div>`}<div class="grow"><label class="btn sec smb" style="cursor:pointer">${ic('plus',14)} ${m.logo?'Cambiar logo':'Subir logo'}<input type="file" accept="image/*" hidden onchange="subirLogoRes(this)"></label>${m.logo?`<button class="btn ghost smb" style="margin-left:6px" onclick="S.mk.logo=null;render()">Quitar</button>`:''}<p class="note" style="margin:6px 0 0">PNG con fondo transparente o JPG cuadrado. Aparece en la barra superior, la pantalla de entrada, recibos y reportes PDF.</p></div></div></div>
  <h3>Color principal</h3><div class="card"><p class="note" style="margin-top:0">Botones, pestañas activas y selecciones.</p><div class="months" style="gap:8px">${sw('pri',m.pri)}</div><label class="f" style="margin-top:12px">Otro color<input type="color" value="${esc(m.pri)}" oninput="setMk('pri',this.value,true)" style="height:46px;padding:4px"></label></div>
  <h3>Color de la barra superior</h3><div class="card"><label class="chk" style="border:0;padding-top:0"><input type="checkbox" ${m.bar?'':'checked'} onchange="setMk('bar',this.checked?'':S.mk.pri)"><span class="sm">Igual que el color principal</span></label>${m.bar?`<div class="months" style="gap:8px;margin-top:8px">${sw('bar',m.bar)}</div><label class="f" style="margin-top:12px">Otro color<input type="color" value="${esc(m.bar)}" oninput="setMk('bar',this.value,true)" style="height:46px;padding:4px"></label>`:''}</div>
  ${lum(m.pri)>.6?alertBox('warn','Color muy claro','El texto de los botones se verá en negro para que se pueda leer.'):''}
  <button class="btn block big-ok" onclick="guardarMarca()">Guardar logo y colores</button><button class="btn ghost block" onclick="S.mk={pri:'#0f766e',bar:'',logo:S.mk.logo};render()">Volver a los colores de GateWise</button>`}

/* =========================================================
   NUBE: sincronización entre dispositivos (Firebase Realtime Database)
   Cada sección de los datos (casas, pagos, pases, tienda…) se guarda como texto
   en gw/r/{residencial}/{sección}; la plataforma en gw/plat/{sección}.
   ========================================================= */
const FB_SDK='https://www.gstatic.com/firebasejs/10.12.5/';
const NUBE={on:false,estado:'local',err:'',db:null,resRef:null,resId:null,resReady:false,platReady:false,sent:{plat:{},res:{}}};
function cfgNube(){let c=window.GATEWISE_FIREBASE||null;if(!c){try{c=JSON.parse(localStorage.getItem(KEY+'_fb')||'null')}catch(e){}}return c&&c.databaseURL&&c.apiKey?c:null}
function parseCfg(txt){let t=String(txt||'').trim();const m=t.match(/\{[\s\S]*\}/);if(!m)return null;t=m[0];try{const o=JSON.parse(t);return o.apiKey?o:null}catch(e){}const o={};t.replace(/["']?(\w+)["']?\s*:\s*["'`]([^"'`]*)["'`]/g,(_,k,v)=>{o[k]=v});return o.apiKey?o:null}
function cargarJS(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('no se pudo descargar Firebase (revisa el internet)'));document.head.appendChild(s)})}
const serial=(o,skip)=>{const out={};Object.keys(o||{}).forEach(k=>{if(skip&&skip.includes(k))return;out[k]=JSON.stringify(o[k]===undefined?null:o[k])});return out};
const PLAT_SKIP=['ultima'];
function errNube(e){NUBE.err=e&&e.message||String(e);console.warn('Nube:',NUBE.err);if(/permission/i.test(NUBE.err))toast('La nube rechazó el cambio: revisa las reglas de la base de datos')}
async function iniciarNube(){const cfg=cfgNube();if(!cfg)return;NUBE.estado='conectando';pintarNube();
  try{if(!window.firebase){await cargarJS(FB_SDK+'firebase-app-compat.js');await cargarJS(FB_SDK+'firebase-auth-compat.js');await cargarJS(FB_SDK+'firebase-database-compat.js')}
    if(!firebase.apps.length)firebase.initializeApp(cfg);await firebase.auth().signInAnonymously();NUBE.db=firebase.database();NUBE.on=true;
    const pr=NUBE.db.ref('gw/plat');const snap=await pr.once('value');
    if(!snap.exists()){await subirTodo()}
    pr.on('value',s=>recibirPlat(s.val()));
    if(RES)escucharRes(RES);
    if(S.user&&S.user.rol==='superadmin')cachearResidenciales();
    NUBE.db.ref('.info/connected').on('value',s=>{NUBE.estado=s.val()?'conectado':'sin conexión';pintarNube()});
  }catch(e){NUBE.on=false;NUBE.estado='error';errNube(e);pintarNube();toast('No se pudo conectar a la nube: '+NUBE.err)}}
async function subirTodo(){const up={};const pl=serial(PLAT,PLAT_SKIP);up['gw/plat']=pl;NUBE.sent.plat=Object.assign({},pl);
  (PLAT.residenciales||[]).forEach(r=>{const d=r.id===RES?DB:leerDB(r.id);if(d)up['gw/r/'+r.id]=serial(d)});
  if(RES&&up['gw/r/'+RES]){NUBE.sent.res=Object.assign({},up['gw/r/'+RES]);NUBE.resId=RES}NUBE.platReady=true;await NUBE.db.ref().update(up)}
function nubePlat(){if(!NUBE.on||!NUBE.platReady||!PLAT)return;const s=serial(PLAT,PLAT_SKIP),u={};Object.keys(s).forEach(k=>{if(s[k]!==NUBE.sent.plat[k]){u[k]=s[k];NUBE.sent.plat[k]=s[k]}});if(Object.keys(u).length)NUBE.db.ref('gw/plat').update(u).catch(errNube)}
function nubeRes(){if(!NUBE.on||!DB||!RES)return;if(NUBE.resId!==RES){escucharRes(RES);return}if(!NUBE.resReady)return;const s=serial(DB),u={};Object.keys(s).forEach(k=>{if(s[k]!==NUBE.sent.res[k]){u[k]=s[k];NUBE.sent.res[k]=s[k]}});if(Object.keys(u).length)NUBE.db.ref('gw/r/'+RES).update(u).catch(errNube)}
function nubeSetRes(id,d){if(NUBE.on)NUBE.db.ref('gw/r/'+id).set(serial(d)).catch(errNube)}
function nubeBorrarRes(id){if(NUBE.on)NUBE.db.ref('gw/r/'+id).remove().catch(errNube)}
function escucharRes(id){if(!NUBE.on)return;if(NUBE.resRef)NUBE.resRef.off();NUBE.resId=id;NUBE.resReady=false;NUBE.sent.res={};const r=NUBE.db.ref('gw/r/'+id);NUBE.resRef=r;r.on('value',s=>recibirRes(id,s.val()),errNube)}
function recibirRes(id,val){if(id!==RES)return;
  if(!val){if(!NUBE.resReady&&DB){const all=serial(DB);NUBE.sent.res=Object.assign({},all);NUBE.resReady=true;NUBE.db.ref('gw/r/'+id).set(all).catch(errNube)}return}
  const primera=!NUBE.resReady;let cambio=false;Object.keys(val).forEach(k=>{if(val[k]!==NUBE.sent.res[k]){NUBE.sent.res[k]=val[k];try{DB[k]=JSON.parse(val[k])}catch(e){}cambio=true}});NUBE.resReady=true;
  if(primera){DB.visitasCobro=DB.visitasCobro||[];DB.cierres=DB.cierres||[];if(!DB.tienda)DB.tienda={productos:[],pedidos:[],seq:0};ensureCuotas();try{localStorage.setItem(dbKey(RES),JSON.stringify(DB))}catch(e){}nubeRes()}
  else if(cambio){try{localStorage.setItem(dbKey(RES),JSON.stringify(DB))}catch(e){}}
  if(cambio||primera)refrescarVista()}
function recibirPlat(val){if(!val){return}const primera=!NUBE.platReady;let cambio=false;Object.keys(val).forEach(k=>{if(PLAT_SKIP.includes(k))return;if(val[k]!==NUBE.sent.plat[k]){NUBE.sent.plat[k]=val[k];try{PLAT[k]=JSON.parse(val[k])}catch(e){}cambio=true}});NUBE.platReady=true;
  if(!cambio&&!primera)return;try{localStorage.setItem(PKEY,JSON.stringify(PLAT))}catch(e){}
  if(!PLAT.residenciales.length){if(RES){RES=null;DB=null;if(S.user&&S.user.rol!=='superadmin')salir()}}else if(!RES||!PLAT.residenciales.some(r=>r.id===RES)){if(S.user&&S.user.rol!=='superadmin'){S.user=null;setSes('')}load(PLAT.residenciales[0].id)}
  if(primera)nubePlat();refrescarVista()}
function refrescarVista(){if(S.user){if(S.user.rol==='superadmin'){S.user=PLAT.superadmins.find(x=>x.id===S.user.id)||S.user;if(S.imp)S.imp=PLAT.superadmins.find(x=>x.id===S.imp.id)||S.imp}else{const u=DB&&usuario(S.user.id);if(!u){salir();return}S.user=u}}
  const a=document.activeElement;const escribiendo=a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName);if(S.chatOpen&&document.getElementById('chatBox'))refrescarChat();if(!escribiendo){const y=window.scrollY;render();window.scrollTo(0,y)}}
function cachearResidenciales(){if(!NUBE.on)return;NUBE.db.ref('gw/r').once('value').then(s=>{const v=s.val()||{};Object.keys(v).forEach(id=>{if(id===RES)return;const d={};Object.keys(v[id]||{}).forEach(k=>{try{d[k]=JSON.parse(v[id][k])}catch(e){}});try{localStorage.setItem(dbKey(id),JSON.stringify(d))}catch(e){}});if(S.user&&S.user.rol==='superadmin')refrescarVista()}).catch(errNube)}
async function nubeBorrarTodo(){if(!NUBE.on)return;NUBE.sent={plat:{},res:{}};NUBE.resReady=false;NUBE.platReady=false;await NUBE.db.ref('gw').remove()}
function pintarNube(){document.querySelectorAll('.nubeEstado').forEach(el=>el.innerHTML=nubeTxt())}
const nubeTxt=()=>!cfgNube()?'📱 Datos solo en este dispositivo':NUBE.estado==='conectado'?'☁️ Conectado a la nube · datos compartidos entre dispositivos':NUBE.estado==='conectando'?'☁️ Conectando a la nube…':NUBE.estado==='sin conexión'?'☁️ Sin internet · se sincroniza al volver la conexión':'⚠️ Nube con error: '+esc(NUBE.err);
function enlaceNube(){const c=cfgNube();if(!c)return'';const b=btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return location.origin+location.pathname+'#cfg='+b}
function verNube(){const c=cfgNube();const link=enlaceNube();
  sheet('Conexión a la nube',`<div class="alert ${NUBE.estado==='conectado'?'ok':c?'warn':'info'}"><b class="nubeEstado">${nubeTxt()}</b>${c?`<p>Proyecto Firebase: ${esc(c.projectId||'')}</p>`:'<p>Conecta la app a tu proyecto Firebase para que todos los teléfonos compartan los mismos datos.</p>'}</div>
  ${c&&link?`<h3>Conectar otros teléfonos</h3><p class="note" style="margin-top:0">Envía este enlace a quienes van a probar la demo. Al abrirlo una vez, su teléfono queda conectado.</p><textarea id="nubeLink" readonly style="min-height:70px;font-size:13px">${esc(link)}</textarea><div class="btns" style="margin-top:6px"><button class="btn" onclick="copiarNube()">Copiar enlace</button><a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Prueba GateWise: '+link)}">Enviar por WhatsApp</a></div>`:''}
  ${window.GATEWISE_FIREBASE?'<p class="note">Este sitio ya trae la configuración en el archivo config.js; todos los dispositivos se conectan solos.</p>':`<h3>${c?'Cambiar':'Pegar'} configuración</h3><p class="note" style="margin-top:0">En Firebase: Configuración del proyecto › Tus apps › Web › copia el bloque <b>firebaseConfig</b> y pégalo aquí.</p><textarea id="nubeCfg" placeholder="const firebaseConfig = { apiKey: ..., databaseURL: ... }"></textarea><button class="btn block" onclick="guardarCfgNube()">Conectar este dispositivo</button>${c?`<button class="btn ghost block" onclick="desconectarNube()">Desconectar este dispositivo</button>`:''}`}`)}
async function copiarNube(){const t=document.getElementById('nubeLink');try{await navigator.clipboard.writeText(t.value);toast('Enlace copiado')}catch(e){t.select();toast('Selecciona y copia el enlace')}}
function guardarCfgNube(){const c=parseCfg(document.getElementById('nubeCfg').value);if(!c)return toast('No reconozco la configuración. Copia todo el bloque firebaseConfig');if(!c.databaseURL)return toast('Falta databaseURL: primero crea la Realtime Database en Firebase y vuelve a copiar la configuración');try{localStorage.setItem(KEY+'_fb',JSON.stringify(c))}catch(e){}toast('Conectando…');setTimeout(()=>location.reload(),400)}
function desconectarNube(){try{localStorage.removeItem(KEY+'_fb')}catch(e){}location.reload()}
(function cfgDesdeEnlace(){const h=location.hash||'';if(!h.startsWith('#cfg='))return;try{const b=h.slice(5).replace(/-/g,'+').replace(/_/g,'/');const c=JSON.parse(decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4)))));if(c&&c.apiKey&&c.databaseURL){localStorage.setItem(KEY+'_fb',JSON.stringify(c))}}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}})();

function borrarRes(id){const L=resDB();const i=L.findIndex(r=>r.id===id);if(i<0)return;const r=L[i];L.splice(i,1);save();closeSheet();render();verResenas(r.tipo,r.ref);toast('Opinión eliminada')}
function responderRes(id){const r=resDB().find(x=>x.id===id);if(!r)return;
  sheet('Responder opinión',`<div class="card"><div class="row" style="gap:8px">${stars(r.estrellas,14)}<b class="sm">${esc(autorNom(r))}</b></div>${r.texto?`<p class="sm" style="margin:6px 0 0">${esc(r.texto)}</p>`:''}</div><form onsubmit="guardarResp(event,'${id}')"><label class="f">Tu respuesta (pública)<textarea name="texto" maxlength="400" required>${esc(r.resp?r.resp.texto:'')}</textarea></label><button class="btn block">Publicar respuesta</button>${r.resp?`<button type="button" class="btn ghost block" onclick="guardarResp(null,'${id}')">Quitar respuesta</button>`:''}</form>`)}
function guardarResp(e,id){if(e)e.preventDefault();const r=resDB().find(x=>x.id===id);if(!r)return;
  if(!e){delete r.resp}else{const t=String(new FormData(e.target).get('texto')||'').trim();if(!t)return;const own=r.tipo==='tienda'&&S.user.id===r.ref;
    r.resp={de:own?S.user.negocio:'Administración',texto:t,fecha:nowISO()};notificar([r.userId],'💬 Respondieron tu opinión',`${r.resp.de}: ${t.slice(0,90)}`,{tab:r.tipo==='tienda'?'tienda':'directorio'})}
  save();closeSheet();render();verResenas(r.tipo,r.ref)}
function ocultarRes(id){const r=resDB().find(x=>x.id===id);if(!r)return;r.oculta=!r.oculta;save();closeSheet();render();verResenas(r.tipo,r.ref);toast(r.oculta?'Opinión oculta para los residentes':'Opinión visible otra vez')}
/* Tarjetas en tienda y pedido */
function resumenCard(tipo,ref){const{n,avg,l}=resumenRes(tipo,ref);const m=miRes(tipo,ref);const pc=puedeCalif(tipo,ref);
  return `<div class="card"><div class="row"><div class="grow"><b>Opiniones de vecinos</b><div style="margin-top:4px">${n?`<span class="rate">${stars(avg,18)}<b style="font-size:17px">${avg.toFixed(1)}</b><span class="muted">(${n})</span></span>`:`<span class="sm muted">Aún no hay opiniones</span>`}</div></div>${pc?`<button class="btn smb" onclick="calificar('${tipo}','${ref}')">${ic('star',14)} ${m?'Editar':'Calificar'}</button>`:''}</div>
  ${l.slice(0,2).map(r=>`<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><div class="row" style="gap:8px">${stars(r.estrellas,13)}<b class="sm">${esc(autorNom(r))}</b></div>${r.texto?`<p class="sm" style="margin:4px 0 0">${esc(r.texto.length>140?r.texto.slice(0,140)+'…':r.texto)}</p>`:''}</div>`).join('')}
  ${n?`<button class="btn ghost block smb" style="margin-top:10px" onclick="verResenas('${tipo}','${ref}')">Ver todas las opiniones</button>`:''}</div>`}
function invitaCalif(p){const m=resDB().find(r=>r.tipo==='tienda'&&r.ref===p.vendedorId&&r.userId===S.user.id);
  return m?`<div class="card row"><span class="grow sm">Tu opinión de esta tienda: ${stars(m.estrellas,14)}</span><button class="btn smb ghost" onclick="calificar('tienda','${p.vendedorId}')">Editar</button></div>`
   :`<div class="card calif-cta"><b>¿Cómo te fue con tu pedido?</b><p class="sm muted" style="margin:4px 0 8px">Califica la tienda de 1 a 5 estrellas. Tu opinión ayuda a otros vecinos a elegir.</p><button class="btn block" onclick="calificar('tienda','${p.vendedorId}')">${ic('star',18)} Calificar tienda</button></div>`}
/* Ejemplos */
function seedResenas(db){const rs=db.usuarios.filter(u=>u.rol==='residente');const a=i=>rs[i%Math.max(1,rs.length)]||{id:'x',nombre:'Vecino',casaId:''};const sv=(db.directorio&&db.directorio.servicios)||[];const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)+'T10:00'};
  const R=(tipo,ref,u,e,t,dias,resp)=>({id:uid(),tipo,ref,userId:u.id,nombre:u.nombre,casaId:u.casaId,estrellas:e,texto:t,fecha:d(dias),...(resp?{resp}:{})});
  const L=[];
  if(sv[0]){L.push(R('serv',sv[0].id,a(0),5,'Llegó puntual y arregló la fuga del lavamanos en menos de una hora. Cobró lo que cotizó.',6));L.push(R('serv',sv[0].id,a(1),4,'Buen trabajo con el calentador. Tardó un día más de lo acordado, pero quedó bien.',20))}
  if(sv[1])L.push(R('serv',sv[1].id,a(2),5,'Muy responsable y de confianza. Lleva un año ayudándonos dos veces por semana.',12));
  if(sv[2])L.push(R('serv',sv[2].id,a(1),3,'Resolvió el problema del breaker, pero cobró más de lo que me dijo por teléfono.',9));
  if(db.usuarios.some(u=>u.id==='u_ven1')){L.push(R('tienda','u_ven1',a(0),5,'Las pupusas llegan calientitas y rápido. ¡Las mejores de la colonia!',3,{de:'Pupusería Doña Tere',texto:'¡Gracias por su preferencia, vecino!',fecha:d(2)}));L.push(R('tienda','u_ven1',a(2),4,'Muy ricas. El curtido podría traer un poco más.',15))}
  if(db.usuarios.some(u=>u.id==='u_ven2'))L.push(R('tienda','u_ven2',a(1),5,'El pastel tres leches estuvo delicioso y llegó a tiempo para el cumpleaños.',8));
  db.resenas=L}
