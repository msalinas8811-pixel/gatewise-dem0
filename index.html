.top .tt{flex:1;min-width:0}.top small{display:block;opacity:.85;font-size:12px}.top b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}

.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}

.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.bad{background:var(--badbg);color:var(--bad)}.btn.ok{background:var(--ok);color:#fff}

input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
input[type=file]{padding:9px;font-size:14px}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--pri)}

.alert{border-radius:14px;padding:13px 14px;margin-bottom:10px;display:block;width:100%;text-align:left;border:0}
.alert b{display:block}.alert p{margin:3px 0 0;color:var(--text);font-size:14px}
.alert.bad{background:var(--badbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.info{background:var(--infobg);color:var(--info)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}.bars em{font-style:normal;font-weight:700;color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;padding:24px 18px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;margin-bottom:12px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto 10px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tipos button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:13px;font-weight:600;text-align:left;box-shadow:var(--shadow)}

.thread{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0}
.big-ok{font-size:17px;padding:16px}
.combo{position:relative;margin-top:4px}.combo input{margin-top:0}.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:280px;overflow:auto;padding:4px}
.combo-it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px;border-radius:8px;text-align:left;color:var(--text);font-weight:600}.combo-it:hover,.combo-it:focus{background:var(--pri2)}.combo-it small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.note{font-size:13px;color:var(--muted);margin:6px 0 12px}
</style>

function leerArchivo(file){return new Promise((res,rej)=>{if(!file||!file.size)return res(null);const r=new FileReader();

  else if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>900000)return res({tipo:'pdf',nombre:file.name,data:null});r.onload=()=>res({tipo:'pdf',nombre:file.name,data:r.result});r.onerror=rej;r.readAsDataURL(file)}

function autoRecordatorio(u){if(u.rol!=='residente')return;const per=periodoActual(),k=u.casaId+'_'+per;if(DB.recordados[k])return;
  const m=moraCasa(u.casaId);const pend=pendCasa(u.casaId);
  if(m.length){notificar([u.id],'💳 Tienes pagos vencidos',`${m.length} mes(es) en mora: ${m.map(c=>perL(c.periodo)).join(', ')}. Total ${money(sum(m,montoCuota))}.`,{tipo:'pagar',periodos:m.map(c=>c.periodo)});DB.recordados[k]=1}
  else if(pend.length){const dias=Math.round((new Date(vence(per)+'T12:00')-new Date(ymd()+'T12:00'))/864e5);if(dias<=DB.config.diasAviso){notificar([u.id],'⏰ Tu cuota vence pronto',`La cuota de ${perL(per)} vence el ${fFecha(vence(per))}.`,{tipo:'pagar',periodos:[per]});DB.recordados[k]=1}}}

async function abrirCamara(){
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720}},audio:false});
    sheet('Foto en tiempo real',`<div class="alert info"><b>${esc(S.reto)}</b></div><video id="camv" autoplay playsinline muted style="width:100%;border-radius:12px;transform:scaleX(-1);background:#000"></video><button class="btn block" onclick="capturarSelfie()">${ic('check',18)} Tomar foto</button>`);
    camStream=st;const v=document.getElementById('camv');v.srcObject=st;try{await v.play()}catch(e){}return}catch(e){camStream=null}}
  document.getElementById('selfieIn').click()}
function sellar(c,metodo){selloVivo(c,'Verificación en vivo · '+fFecha(nowISO()),'Reto: '+S.reto);SELFIE={tipo:'img',nombre:'selfie.jpg',data:c.toDataURL('image/jpeg',.75),fecha:nowISO(),reto:S.reto,metodo};pintarSelfie();const b=document.querySelector('[onclick="abrirCamara()"]');if(b)b.textContent='Repetir foto';toast('Foto en tiempo real lista')}
function capturarSelfie(){const v=document.getElementById('camv');if(!v||!v.videoWidth)return toast('La cámara aún no está lista');const s=Math.min(1,900/v.videoWidth);const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);x.setTransform(1,0,0,1,0,0);closeSheet();sellar(c,'camara')}
function selfieArchivo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Debe ser una foto');
  if(Date.now()-f.lastModified>5*60*1000)return toast('La foto debe tomarse en este momento con la cámara, no desde la galería');
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);sellar(c,'captura')};img.src=r.result};r.readAsDataURL(f)}
async function enviarRegistro(e){e.preventDefault();const f=new FormData(e.target);const c=casa(f.get('casa'));
  if(String(f.get('codigo')).trim().toUpperCase()!==c.codigo)return toast('El código no coincide con la casa seleccionada');
  if(!duiValido(String(f.get('dui')).trim()))return toast('El DUI debe tener 9 dígitos: 00000000-0');
  const un=String(f.get('user')).trim().toLowerCase();if(DB.usuarios.some(u=>u.user.toLowerCase()===un)||DB.solicitudes.some(s=>s.estado==='pendiente'&&s.user.toLowerCase()===un))return toast('Ese usuario ya existe, elige otro');
  if(DB.solicitudes.some(s=>s.estado==='pendiente'&&s.casaId===c.id))return toast('Ya hay una solicitud pendiente para esa casa');
  if(!SELFIE)return toast('Falta la foto en tiempo real');
  let doc,duif,foto;try{doc=await leerArchivo(f.get('doc'));duif=await leerArchivo(f.get('duif'));foto=await leerArchivo(f.get('foto'))}catch(x){return toast('Archivo no válido. Usa foto o PDF')}
  DB.solicitudes.unshift({id:uid(),casaId:c.id,nombre:f.get('nombre'),familia:String(f.get('familia')).trim(),dui:f.get('dui'),tel:f.get('tel'),email:f.get('email'),user:un,pass:f.get('pass'),documento:doc,duiFoto:duif,foto,selfie:SELFIE,estado:'pendiente',fecha:nowISO()});
  notificar(admins(),'Nueva solicitud de registro',`${f.get('nombre')} solicita acceso como propietario(a) de ${casaNom(c.id)}.`,{tab:'solicitudes'});save();SELFIE=null;
  S.tab='inicio';render();sheet('Solicitud enviada',`<p>Tu solicitud para <b>${casaNom(c.id)}</b> quedó en revisión. La administración validará tus documentos y tu foto, y te avisará. Después podrás ingresar con tu usuario <b>${esc(un)}</b>.</p><button class="btn block" onclick="closeSheet()">Entendido</button>`)}

function abrirNotif(id){const n=DB.notifs.find(x=>x.id===id);if(!n)return;n.leida=true;save();closeSheet();const a=n.accion;if(!a)return render();if(a.tipo==='pagar'){S.sel=a.periodos;return go('pagos')}if(a.tipo==='pedido'||a.tipo==='chat'){if(!pedido(a.id))return render();go(S.user.rol==='vendedor'?'pedidos':S.user.rol==='admin'?'tienda':'tienda',S.user.rol==='vendedor'||S.user.rol==='admin'?undefined:'pedidos');return a.tipo==='chat'?abrirChat(a.id):verPedido(a.id)}go(a.tab||'inicio',a.sub)}

function vAdmInicio(){
  const mor=morosos(),totalM=sum(mor,x=>x.total);
  const pv=DB.pagos.filter(p=>p.estado==='revision').length;
  const sol=DB.solicitudes.filter(s=>s.estado==='pendiente').length;
  const rec=DB.reclamos.filter(r=>r.estado!=='resuelto').length;
  const den=DB.pases.filter(dentro).length,mes=periodoActual();
  const recaud=sum(DB.pagos.filter(p=>p.estado==='aprobado'&&(p.fechaAprob||p.fecha).slice(0,7)===mes),p=>p.monto);
  const pers=[...Array(6)].map((_,i)=>addMonths(mes,i-5));
  const pct=pers.map(p=>{const cs=DB.cuotas.filter(c=>c.periodo===p);return cs.length?Math.round(cs.filter(c=>c.estado==='pagado').length/cs.length*100):0});
  const R_=DB.residencial,pr=miembro('Presidente');let h=`<h2>Hola, ${esc(S.user.nombre.split(' ')[0])}</h2><button class="item" onclick="go('residencial')"><div class="av">${ic('houses',20)}</div><div class="grow"><b>${esc(R_.nombre)}</b><div class="sm muted">${esc(R_.direccion)} · ${esc(R_.municipio)}</div><div class="sm">${DB.casas.length} casas · ${portones().length} portones · Presidente: ${esc(pr?pr.nombre:'sin asignar')}</div></div>${ic('chev',18)}</button>`;
  if(sol)h+=alertBox('info',`${sol} solicitud(es) de registro`,'Propietarios esperando validación de documentos.',"go('solicitudes')");
  {const nc=DB.cierres.filter(c=>c.estado==='enviado').length;if(nc)h+=alertBox('warn',`${nc} cierre(s) de cobrador por cuadrar`,'Compara el efectivo entregado con los recibos.',"S.cseg='cierres';go('cobros')")}
  if(pv)h+=alertBox('warn',`${pv} pago(s) por validar`,'Comprobantes adjuntados por residentes.',"S.pseg='validar';go('pagos')");
  h+=`<div class="kpis">${kpi('Recaudado este mes',money(recaud),"S.pseg='historial';go('pagos')")}${kpi('Por cobrar en mora',money(totalM),"S.pseg='mora';go('pagos')")}${kpi('Casas en mora',mor.length+' de '+DB.casas.length,"S.cf='mora';go('casas')")}${kpi('Personas dentro ahora',den,"go('accesos')")}${kpi('Reclamos abiertos',rec,"go('reclamos')")}${kpi('Pases activos hoy',DB.pases.filter(vigenteHoy).length,"go('accesos')")}</div>`;
  h+=`<h3>% de casas al día por mes</h3><div class="card"><div class="bars">${pers.map((p,i)=>`<div><em>${pct[i]}%</em><i style="height:${Math.max(pct[i],2)}%"></i>${perC(p)}</div>`).join('')}</div></div>`;
  h+=`<h3>Casas en mora</h3>${mor.slice(0,6).map(moraRow).join('')||empty('Ninguna casa en mora 🎉')}${mor.length>6?`<button class="btn ghost block" onclick="S.pseg='mora';go('pagos')">Ver todas (${mor.length})</button>`:''}`;
  return h}

function listaCasas(){const q=(S.q||'').toLowerCase();
  const l=DB.casas.filter(c=>{const e=estadoCasa(c);if(S.cf==='mora'&&e.c!=='bad')return false;if(S.cf==='aldia'&&e.c==='bad')return false;if(S.cf==='sin'&&c.duenoId)return false;if(S.cpol&&c.pasaje!==S.cpol)return false;return !q||normTxt('casa '+c.numero+' '+c.pasaje+' '+(c.familia||'')+' '+duenoNom(c.id)+' '+telDueno(c.id)).includes(normTxt(q))});

/* Accesos / bitácora (admin y vigilancia) */
function ingresoRow({p,i}){const g=usuario(i.guardiaId);return `<div class="item">${tAv(p.tipo)}<div class="grow"><b>${esc(p.nombre)}</b> <span class="muted sm">· ${casaNom(p.casaId)}</span><div class="sm muted">${TIPOS[p.tipo].l}${p.detalle?' · '+esc(p.detalle):''}</div><div class="sm">🚪 ${esc(portonNom(i.porton||p.porton))} · Entró ${fFecha(i.entrada)}${i.salida?' · salió '+hora(i.salida):''}${g?' · '+esc(g.nombre.split(' ')[0]):''}</div></div>${i.salida?chip('Salió','mut'):chip('Dentro','ok')}</div>`}
function vBitacora(){S.fAcc=S.fAcc||ymd();S.fTipo=S.fTipo||'todos';const r=[];DB.pases.forEach(p=>p.ingresos.forEach(i=>{if(i.entrada.slice(0,10)===S.fAcc&&(S.fTipo==='todos'||p.tipo===S.fTipo))r.push({p,i})}));r.sort((a,b)=>b.i.entrada.localeCompare(a.i.entrada));
  const den=DB.pases.filter(dentro);const adm=S.user.rol==='admin';
  return `<h2>${adm?'Accesos y bitácora':'Bitácora'}</h2>${adm?`<h3>Dentro de la colonia ahora (${den.length})</h3>${den.map(p=>ingresoRow({p,i:p.ingresos[p.ingresos.length-1]})).join('')||empty('Nadie dentro')}<h3>Registro por día</h3>`:''}
  <div class="two"><label class="f">Fecha<input type="date" value="${S.fAcc}" onchange="S.fAcc=this.value;render()"></label><label class="f">Tipo<select onchange="S.fTipo=this.value;render()"><option value="todos">Todos</option>${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${S.fTipo===k?'selected':''}>${t.l}</option>`).join('')}</select></label></div>
  <p class="note">${r.length} ingreso(s)</p>${r.map(ingresoRow).join('')||empty('Sin ingresos en esta fecha')}
  ${adm?`<h3>Pases vigentes hoy (${DB.pases.filter(vigenteHoy).length})</h3>${DB.pases.filter(vigenteHoy).map(p=>{const e=estadoPase(p);return `<div class="item">${tAv(p.tipo)}<div class="grow"><b>${esc(p.nombre)}</b> <span class="sm muted">· ${casaNom(p.casaId)}</span><div class="sm muted">${vigencia(p)}</div></div>${chip(e.l,e.c)}</div>`}).join('')}`:''}`}

/* Reclamos (admin y residente) */
function reclamoItem(r){const e=EST_R[r.estado];return `<button class="item" onclick="verReclamo('${r.id}')"><div class="grow"><b>${esc(r.titulo)}</b><div class="sm muted">${esc(r.categoria)} · ${casaNom(r.casaId)} · ${fFecha(r.fecha)}</div></div>${chip(e.l,e.c)}</button>`}
function vReclamos(){const adm=S.user.rol==='admin';S.rseg=S.rseg||'activos';
  let l=adm?DB.reclamos:DB.reclamos.filter(r=>r.casaId===S.user.casaId);
  l=l.filter(r=>S.rseg==='activos'?r.estado!=='resuelto':r.estado==='resuelto').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `<div class="row"><h2 class="grow" style="margin:0">Reclamos y reportes</h2>${!adm?`<button class="btn smb" onclick="nuevoReclamo()">${ic('plus',16)} Reportar</button>`:''}</div>${!adm?`<p class="note">Reporta cualquier evento: daños, seguridad, ruido, basura. La administración te responde aquí.</p>`:''}${seg('rseg',[['activos','Activos'],['resueltos','Resueltos']])}${l.map(reclamoItem).join('')||empty('Sin reportes')}`}
function nuevoReclamo(){sheet('Nuevo reporte',`<form onsubmit="crearReclamo(event)"><label class="f">Categoría<select name="cat">${CATR.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="f">Título<input name="t" required></label><label class="f">Descripción<textarea name="d" required></textarea></label><label class="f">Ubicación<input name="u" placeholder="Ej. Pasaje B, frente a casa 9"></label><label class="f">Foto (opcional)<input name="foto" type="file" accept="image/*"></label><button class="btn block">Enviar reporte</button></form>`)}
async function crearReclamo(e){e.preventDefault();const f=new FormData(e.target);let foto=null;try{foto=await leerArchivo(f.get('foto'))}catch(x){return toast('Foto no válida')}
  const r={id:uid(),casaId:S.user.casaId,usuarioId:S.user.id,categoria:f.get('cat'),titulo:f.get('t'),descripcion:f.get('d'),ubicacion:f.get('u'),foto,estado:'abierto',fecha:nowISO(),hilo:[]};DB.reclamos.unshift(r);
  notificar(admins(),'📝 Nuevo reporte: '+r.titulo,`${casaNom(r.casaId)} · ${r.categoria}`,{tab:'reclamos'});save();closeSheet();render();toast('Reporte enviado')}
function verReclamo(id){const r=DB.reclamos.find(x=>x.id===id);const adm=S.user.rol==='admin';const a=usuario(r.usuarioId);
  sheet(esc(r.titulo),`<div class="kv"><span>Estado</span><b>${chip(EST_R[r.estado].l,EST_R[r.estado].c)}</b><span>Categoría</span><b>${esc(r.categoria)}</b><span>Casa</span><b>${casaNom(r.casaId)}</b><span>Reportó</span><b>${esc(a?a.nombre:'')}</b><span>Fecha</span><b>${fFecha(r.fecha)}</b>${r.ubicacion?`<span>Ubicación</span><b>${esc(r.ubicacion)}</b>`:''}</div><p style="white-space:pre-wrap">${esc(r.descripcion)}</p>${r.foto?`<img class="thumb" src="${r.foto.data}" alt="Foto del reporte">`:''}
  <h3>Seguimiento</h3>${r.hilo.map(m=>{const u=usuario(m.autor);return `<div class="thread"><b class="sm">${esc(u?u.nombre:'')}${u&&u.rol==='admin'?' · Administración':''}</b><div>${esc(m.texto)}</div><div class="muted sm">${fFecha(m.fecha)}</div></div>`}).join('')||'<p class="note">Sin respuestas aún.</p>'}
  <form onsubmit="responderReclamo(event,'${r.id}')">${adm?`<label class="f">Cambiar estado<select name="est">${Object.entries(EST_R).map(([k,v])=>`<option value="${k}" ${r.estado===k?'selected':''}>${v.l}</option>`).join('')}</select></label>`:''}<label class="f">${adm?'Respuesta al residente':'Agregar comentario'}<textarea name="t" ${adm?'':'required'}></textarea></label><button class="btn block">${adm?'Guardar y notificar':'Enviar'}</button></form>`)}
function responderReclamo(e,id){e.preventDefault();const f=new FormData(e.target);const r=DB.reclamos.find(x=>x.id===id);const t=String(f.get('t')||'').trim();const adm=S.user.rol==='admin';
  if(t)r.hilo.push({autor:S.user.id,texto:t,fecha:nowISO()});
  if(adm){const ne=f.get('est');const cambio=ne!==r.estado;r.estado=ne;if(cambio||t)notificar([r.usuarioId],'📝 Tu reporte: '+r.titulo,(cambio?'Estado: '+EST_R[ne].l+'. ':'')+t,{tab:'reclamos'})}
  else notificar(admins(),'💬 Comentario en reporte',r.titulo+': '+t,{tab:'reclamos'});
  save();closeSheet();render();toast('Guardado')}

/* Solicitudes de registro */
function vSolicitudes(){const p=DB.solicitudes.filter(s=>s.estado==='pendiente'),h=DB.solicitudes.filter(s=>s.estado!=='pendiente');
  const mini=(s,k,l)=>s[k]&&s[k].data&&s[k].tipo==='img'?`<button style="border:0;background:none;padding:0;text-align:center" onclick="verDocSol('${s.id}','${k}')"><img src="${s[k].data}" alt="${l}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)"><div class="sm muted">${l}</div></button>`:`<div class="empty sm" style="padding:10px">Sin ${l.toLowerCase()}</div>`;
  return `<h2>Solicitudes de registro</h2><p class="note">Compara el rostro de la foto en tiempo real con el DUI y la foto de perfil, revisa que cumplió el reto y que el documento de propiedad esté a su nombre.</p>${p.map(s=>{const c=casa(s.casaId);return `<div class="card"><div class="row">${avatar(s,48)}<div class="grow"><b>${esc(s.nombre)}</b><div class="sm muted">${casaNom(s.casaId)} · ${esc(c.pasaje)} · ${fFecha(s.fecha)}</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${mini(s,'selfie','En vivo')}${mini(s,'duiFoto','DUI')}${mini(s,'foto','Perfil')}</div>
  ${s.selfie?`<div class="sm" style="margin-top:8px">${chip(s.selfie.metodo==='camara'?'Cámara en vivo':'Cámara del teléfono','info')} Reto: <b>${esc(s.selfie.reto)}</b> · ${fFecha(s.selfie.fecha)}</div>`:alertBox('warn','Sin foto en tiempo real','')}
  <div class="kv" style="margin-top:10px"><span>Familia</span><b>${esc(s.familia||'—')}</b><span>DUI</span><b>${esc(s.dui)}</b><span>Teléfono</span><b>${esc(s.tel)}</b><span>Correo</span><b>${esc(s.email)}</b><span>Usuario</span><b>${esc(s.user)}</b></div>${c.duenoId?alertBox('warn','La casa ya tiene propietario',`Si apruebas, ${esc(duenoNom(c.id))} y sus inquilinos quedarán desactivados.`):''}<div class="btns"><button class="btn ghost smb" onclick="verDocSol('${s.id}','documento')">Ver documento de propiedad</button></div><div class="btns"><button class="btn ok" onclick="aprobarSol('${s.id}')">Aprobar</button><button class="btn bad" onclick="rechazarSol('${s.id}')">Rechazar</button></div></div>`}).join('')||empty('No hay solicitudes pendientes')}
  ${h.length?`<h3>Historial</h3>${h.map(s=>`<div class="item">${avatar(s,40)}<div class="grow"><b>${esc(s.nombre)}</b><div class="sm muted">${casaNom(s.casaId)} · ${fFecha(s.fecha)}${s.motivo?' · '+esc(s.motivo):''}</div></div>${chip(s.estado==='aprobada'?'Aprobada':'Rechazada',s.estado==='aprobada'?'ok':'bad')}</div>`).join('')}`:''}`}
function verDocSol(id,k){const s=DB.solicitudes.find(x=>x.id===id);verArchivo(s[k],{documento:'Documento de propiedad',duiFoto:'DUI',foto:'Foto de perfil',selfie:'Foto en tiempo real'}[k])}
function aprobarSol(id){const s=DB.solicitudes.find(x=>x.id===id);const c=casa(s.casaId);if(DB.usuarios.some(u=>u.user.toLowerCase()===s.user.toLowerCase()))return toast('El usuario ya existe; rechaza y pide otro');
  if(c.duenoId&&!confirm('La casa ya tiene propietario. ¿Reemplazarlo?'))return;
  if(c.duenoId)DB.usuarios.forEach(u=>{if(u.id===c.duenoId||(u.rol==='inquilino'&&u.padreId===c.duenoId))u.activo=false});
  const u={id:'u_'+uid(),rol:'residente',nombre:s.nombre,user:s.user,pass:s.pass,casaId:c.id,tel:s.tel,email:s.email,dui:s.dui,foto:s.foto||null,activo:true};DB.usuarios.push(u);c.duenoId=u.id;if(s.familia)c.familia=s.familia;c.codigo=genCodigo();s.estado='aprobada';
  notificar([u.id],'🎉 Cuenta aprobada','Bienvenido(a). Ya puedes gestionar accesos, pagos y reportes de tu casa.');save();render();toast('Propietario aprobado. Ya puede ingresar con su usuario')}
function rechazarSol(id){const m=prompt('Motivo del rechazo:','Documento no coincide con el propietario');if(m===null)return;const s=DB.solicitudes.find(x=>x.id===id);s.estado='rechazada';s.motivo=m;s.pass='';save();render();toast('Solicitud rechazada')}

/* Vigilantes */
function vVigilantes(){const l=DB.usuarios.filter(u=>u.rol==='vigilante');return `<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0">Vigilancia</h2><button class="btn smb" onclick="nuevoVig()">${ic('plus',16)} Vigilante</button></div><p class="note">Los vigilantes ven los pases de acceso, validan a la persona y marcan su ingreso y salida. El residente recibe el aviso al instante.</p>${l.map(u=>`<div class="item"><div class="av">${ic('shield',20)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">Usuario: ${esc(u.user)} · ${esc(u.turno||'')}</div></div><button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button></div>`).join('')||empty('Sin vigilantes')}`}
function nuevoVig(){sheet('Nuevo vigilante',`<form onsubmit="crearUsuario(event,'vigilante')"><label class="f">Nombre<input name="nombre" required></label><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Turno<select name="turno"><option>Día (6:00–18:00)</option><option>Noche (18:00–6:00)</option><option>24 horas</option></select></label><div class="two"><label class="f">Usuario<input name="user" required autocapitalize="none"></label><label class="f">Contraseña<input name="pass" required minlength="4"></label></div><button class="btn block">Crear usuario</button></form>`)}
function crearUsuario(e,rol){e.preventDefault();const f=new FormData(e.target);if(!duiOk(String(f.get('dui')||'').trim()))return toast('DUI incompleto. Formato: 00000000-0');const un=String(f.get('user')).trim().toLowerCase();if(DB.usuarios.some(u=>u.user.toLowerCase()===un))return toast('Ese usuario ya existe');
  const u={id:'u_'+uid(),rol,nombre:f.get('nombre'),user:un,pass:f.get('pass'),dui:f.get('dui')||'',tel:f.get('tel')||'',activo:true};
  if(rol==='vigilante')u.turno=f.get('turno');if(rol==='admin')u.cargo=f.get('cargo');
  if(rol==='inquilino'){u.casaId=S.user.casaId;u.padreId=S.user.id;u.hasta=f.get('hasta');if(u.hasta<ymd())return toast('La fecha de vigencia ya pasó')}
  DB.usuarios.push(u);save();closeSheet();render();toast('Usuario creado: '+un)}
function toggleUser(id){const u=usuario(id);u.activo=!u.activo;save();render()}

function resGeneral(){const r=DB.residencial;const fld=(k,l,v,t='text')=>`<label class="f">${l}<input name="${k}" type="${t}" value="${esc(v||'')}"></label>`;const pr=miembro('Presidente'),ad=miembro('Administrador(a)');
  return `<div class="card"><div class="kv"><span>Casas</span><b>${DB.casas.length} (${DB.casas.filter(c=>c.duenoId).length} con propietario)</b><span>Polígonos</span><b>${[...new Set(DB.casas.map(c=>c.pasaje))].length}</b><span>Portones</span><b>${portones().length}</b><span>Presidente</span><b>${esc(pr?pr.nombre:'Sin asignar')}</b><span>Administración</span><b>${esc(ad?ad.nombre:'Sin asignar')}</b><span>Vigilantes</span><b>${DB.usuarios.filter(u=>u.rol==='vigilante'&&u.activo).length}</b>${esCondo()?`<span>Torres</span><b>${esc((r.estructura&&r.estructura.torres||[]).join(', ')||'—')}</b><span>Cuota HOA</span><b>${DB.config.modoCuota==='area'?money(DB.config.tarifaArea)+' por '+(DB.config.areaUnidad||areaU()):money(DB.config.cuota)+' por unidad'}${DB.config.reserva?' · reserva '+DB.config.reserva+'%':''}</b><span>Amenidades</span><b>${esc((r.amenidades||[]).join(', ')||'—')}</b><span>Administradora</span><b>${esc(r.empresa||'—')}</b>`:''}</div></div>

  <h3>Cuenta para transferencias</h3><div class="card">${fld('b.banco','Banco',r.banco.banco)}${fld('b.tipo','Tipo de cuenta',r.banco.tipo)}${fld('b.numero','Número de cuenta',r.banco.numero)}${fld('b.titular','Titular',r.banco.titular)}</div>
  <button class="btn block">Guardar datos generales</button></form>`}
function guardarResidencial(e){e.preventDefault();const r=DB.residencial;const map={r,b:r.banco,v:r.vigilancia};new FormData(e.target).forEach((v,k)=>{const[o,f]=k.split('.');map[o][f]=v});save();{const pr=PLAT.residenciales.find(x=>x.id===RES);if(pr){pr.nombre=r.nombre;pr.municipio=r.municipio;savePlat()}}render();toast('Datos guardados')}
function resEquipo(){const eq=DB.residencial.equipo||(DB.residencial.equipo=[]);const vig=DB.usuarios.filter(u=>u.rol==='vigilante');
  const item=m=>`<button class="item" onclick="editarMiembro('${m.id}')"><div class="av" style="border-radius:50%">${esc(m.nombre.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div class="grow"><b>${esc(m.nombre)}</b><div class="sm muted">${esc(m.telefono||'Sin teléfono')}${m.email?' · '+esc(m.email):''}</div></div>${chip(esc(m.cargo),grupoDe(m.cargo)==='directiva'?'info':'')}</button>`;
  const orden=(a,b)=>{const L=Object.values(CARGOS).flat();return L.indexOf(a.cargo)-L.indexOf(b.cargo)};
  const adms=DB.usuarios.filter(u=>u.rol==='admin');
  return `<h3 style="margin-top:4px">Usuarios con acceso de administración</h3>${adms.map(u=>`<div class="item"><div class="av" style="border-radius:50%">${ic('gear',18)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">${esc(u.cargo||'Administración')} · usuario ${esc(u.user)}</div></div>${u.id===S.user.id?chip('Tú','info'):`<button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button>`}</div>`).join('')}<button class="btn sec block" onclick="nuevoAdminUser()">${ic('plus',18)} Agregar usuario de administración</button>
  <h3>Integrantes</h3><button class="btn block" onclick="editarMiembro()">${ic('plus',18)} Agregar integrante</button>${Object.keys(GRUPO).map(g=>`<h3>${GRUPO[g]}</h3>${eq.filter(m=>grupoDe(m.cargo)===g).sort(orden).map(item).join('')||empty('Sin integrantes')}`).join('')}
  <h3>Cobradores</h3>${DB.usuarios.filter(u=>u.rol==='cobrador').map(u=>`<div class="item"><div class="av" style="border-radius:50%">${ic('card',18)}</div><div class="grow"><b>${esc(u.nombre)}</b><div class="sm muted">${esc(u.tel||'')} · usuario ${esc(u.user)}</div></div><button class="btn smb ${u.activo?'ghost':'sec'}" onclick="toggleUser('${u.id}')">${u.activo?'Desactivar':'Activar'}</button></div>`).join('')||empty('Sin cobradores')}<button class="btn sec block" onclick="nuevoCob()">${ic('plus',18)} Agregar cobrador</button>

function editarMiembro(id){const m=id?(DB.residencial.equipo||[]).find(x=>x.id===id):{};const f=(k,l,t='text')=>`<label class="f">${l}<input name="${k}" type="${t}" value="${esc(m[k]||'')}" ${k==='nombre'?'required':''}${k==='dui'?' inputmode="numeric" maxlength="10" autocomplete="off" placeholder="00000000-0"':''}></label>`;

function resPortones(){const ps=portones();return `<div class="card row"><div class="av">${ic('doorin',20)}</div><div class="grow"><span class="muted sm">Accesos a la residencial</span><div style="font-size:22px;font-weight:800">${ps.length} ${ps.length===1?'portón':'portones'}</div></div><button class="btn smb" onclick="editarPorton()">${ic('plus',16)} Portón</button></div>

  <h3>Por dónde ingresa cada tipo de acceso</h3><div class="card">${Object.entries(TIPOS).map(([k,t])=>`<label class="f">${t.e} ${t.l}<select onchange="DB.residencial.portonTipo['${k}']=this.value;save();toast('Guardado')">${ps.map(p=>`<option value="${p.id}" ${portonDe(k)===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label>`).join('')}<p class="note" style="margin:0">Cada pase nuevo indica por cuál portón debe entrar la persona. Vigilancia lo ve al validar.</p></div>`}
function editarPorton(id){const p=id?portones().find(x=>x.id===id):{};sheet(id?'Editar portón':'Nuevo portón',`<form onsubmit="guardarPorton(event,'${id||''}')"><label class="f">Nombre<input name="nombre" required value="${esc(p.nombre||'')}" placeholder="Ej. Portón norte"></label><label class="f">Tipo de acceso<select name="tipo">${['Vehicular y peatonal','Vehicular','Peatonal'].map(t=>`<option ${p.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="f">Horario<input name="horario" value="${esc(p.horario||'')}" placeholder="Ej. 24 horas"></label><button class="btn block">Guardar</button>${id&&portones().length>1?`<button type="button" class="btn bad block" onclick="borrarPorton('${id}')">Eliminar portón</button>`:''}</form>`)}
function guardarPorton(e,id){e.preventDefault();const f=new FormData(e.target);const o={nombre:String(f.get('nombre')).trim(),tipo:f.get('tipo'),horario:f.get('horario')};const r=DB.residencial;r.portones=r.portones||[];r.portonTipo=r.portonTipo||{};

function vConfig(){const c=DB.config;return `<h2>Cobros y link de pago</h2><form onsubmit="guardarConfig(event)"><div class="card"><div class="two"><label class="f">Cuota mensual ($)<input name="cuota" type="number" step="0.01" min="0" value="${c.cuota}"></label><label class="f">Día de vencimiento<input name="diaVence" type="number" min="1" max="28" value="${c.diaVence}"></label></div><div class="two"><label class="f">Recargo por mes vencido ($)<input name="recargo" type="number" step="0.01" min="0" value="${c.recargo}"></label><label class="f">Recordar X días antes<input name="diasAviso" type="number" min="0" max="20" value="${c.diasAviso}"></label></div><p class="note">La nueva cuota aplica a los meses que se generen a partir de ahora.</p></div>

function guardarConfig(e){e.preventDefault();const f=new FormData(e.target);const c=DB.config;c.cuota=+f.get('cuota');c.diaVence=Math.min(28,Math.max(1,+f.get('diaVence')));c.recargo=+f.get('recargo');c.diasAviso=+f.get('diasAviso');c.linkPago=String(f.get('linkPago')||'').trim();

function autCard(a){return `<div class="card" style="border:2px solid var(--warn)"><div class="row">${tAv(a.tipo)}<div class="grow"><b>${esc(a.nombre)}</b><div class="sm muted">${TIPOS[a.tipo].l}${a.motivo?' · '+esc(a.motivo):''}</div><div class="sm">Vigilancia pide autorización · ${hora(a.fecha)}</div></div></div><div class="btns"><button class="btn ok" onclick="responderAut('${a.id}',true)">Autorizar ingreso</button><button class="btn bad" onclick="responderAut('${a.id}',false)">Rechazar</button></div></div>`}
function responderAut(id,ok){const a=DB.autorizaciones.find(x=>x.id===id);if(a.estado!=='esperando')return toast('Ya fue respondida');a.estado=ok?'aprobado':'rechazado';a.respondidoPor=S.user.id;a.fechaResp=nowISO();
  if(ok){const p={id:uid(),casaId:a.casaId,creadoPor:S.user.id,tipo:a.tipo,porton:a.porton||portonDe(a.tipo),nombre:a.nombre,dui:a.dui,detalle:a.motivo,placa:a.placa,horario:'',desde:ymd(),hasta:ymd(),pin:genPin(),estado:'activo',ingresos:[]};DB.pases.push(p);a.paseId=p.id}
  notificar(vigilantes(),ok?'✅ Ingreso autorizado':'⛔ Ingreso rechazado',`${a.nombre} · ${casaNom(a.casaId)} · respondió ${S.user.nombre}`,{tab:'inicio'});save();render();toast(ok?'Ingreso autorizado':'Ingreso rechazado')}
function vResInicio(){const u=S.user,cid=u.casaId;const aut=DB.autorizaciones.filter(a=>a.casaId===cid&&a.estado==='esperando');
  const hoyP=DB.pases.filter(p=>p.casaId===cid&&(vigenteHoy(p)||dentro(p)));
  let h=`<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0">Hola, ${esc(u.nombre.split(' ')[0])} 👋</h2><button class="btn smb bad" onclick="S.dseg='emergencia';go('directorio')">🚨 Emergencias</button></div>`;

    else if(p.length)h+=alertBox('warn','Cuota del mes pendiente',`Vence el ${fFecha(vence(periodoActual()))}. Toca para pagar.`,"go('pagos')");
    else if(cuotasCasa(cid).some(q=>q.estado==='revision'))h+=alertBox('info','Pago en revisión','La administración está validando tu comprobante.',"go('pagos')");
    else h+=alertBox('ok','Estás al día ✓','Gracias por mantener tus pagos al día.')}
  h+=`<div class="tipos">${Object.entries(TIPOS).map(([k,t])=>`<button onclick="nuevoPase('${k}')"><span class="ti-big ti-${k}">${ic(t.i,22)}</span>${t.l}</button>`).join('')}</div>`;
  h+=`<h3>Accesos de hoy</h3>${hoyP.map(paseItem).join('')||empty('Sin pases para hoy')}`;
  const av=DB.avisos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,2);
  h+=`<h3>Últimos avisos</h3>${av.map(a=>avisoCard(a,false)).join('')||empty('Sin avisos')}`;
  return h}
function paseItem(p){const e=estadoPase(p);return `<button class="item" onclick="verPase('${p.id}')">${tAv(p.tipo)}<div class="grow"><b>${esc(p.nombre)}</b><div class="sm muted">${TIPOS[p.tipo].l}${p.detalle?' · '+esc(p.detalle):''}</div><div class="sm">🚪 ${esc(portonNom(p.porton))}</div></div>${chip(e.l,e.c)}</button>`}
function vAccesos(){const cid=S.user.casaId;S.aseg=S.aseg||'activos';const h=ymd();const ps=DB.pases.filter(p=>p.casaId===cid);
  const act=ps.filter(p=>dentro(p)||(p.estado==='activo'&&p.hasta>=h));const hist=ps.filter(p=>!act.includes(p));const l=(S.aseg==='activos'?act:hist).slice().sort((a,b)=>b.desde.localeCompare(a.desde));
  return `<h2>Control de acceso</h2><p class="note" style="margin-top:-6px">Crea un pase y comparte el PIN. Vigilancia lo valida al llegar y te avisa cuando la persona ingresa.</p><div class="tipos">${Object.entries(TIPOS).map(([k,t])=>`<button onclick="nuevoPase('${k}')"><span class="ti-big ti-${k}">${ic(t.i,22)}</span>${t.l}</button>`).join('')}</div>${seg('aseg',[['activos',`Activos (${act.length})`],['historial','Historial']])}${l.map(paseItem).join('')||empty('Sin pases')}`}
function nuevoPase(tipo){const t=TIPOS[tipo],h=ymd();let f='';
  if(tipo==='personal')f=`<label class="f">Nombre completo<input name="nombre" required></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="00000000-0"></label><label class="f">Oficio<select name="detalle">${OFICIOS.map(o=>`<option>${o}</option>`).join('')}</select></label></div><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${addDays(h,6)}" required></label></div><label class="f">Horario (opcional)<input name="horario" placeholder="Lun–Sáb 7:00–16:00"></label><label class="f">Placa (opcional)<input name="placa"></label>`;
  if(tipo==='entrega')f=`<label class="f">Servicio / restaurante<input name="detalle" required placeholder="Ej. Pedido de pizza"></label><label class="f">Nombre del repartidor (si lo sabes)<input name="nombre" placeholder="Repartidor"></label><label class="f">Fecha<input name="desde" type="date" value="${h}" required></label>`;
  if(tipo==='correo')f=`<label class="f">Empresa de paquetería<input name="nombre" required placeholder="Ej. Courier"></label><label class="f">Detalle del paquete<input name="detalle" placeholder="Ej. Caja mediana a nombre de..."></label><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${addDays(h,2)}" required></label></div>`;
  if(tipo==='visita')f=`<label class="f">Nombre del visitante<input name="nombre" required></label><div class="two"><label class="f">DUI (opcional)<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Placa (opcional)<input name="placa"></label></div><div class="two"><label class="f">Desde<input name="desde" type="date" value="${h}" required></label><label class="f">Hasta<input name="hasta" type="date" value="${h}" required></label></div><label class="f">Motivo (opcional)<input name="detalle"></label>`;
  sheet(t.e+' '+t.l,`<form onsubmit="crearPase(event,'${tipo}')">${f}<div class="alert info"><b>🚪 Ingresará por: ${esc(portonNom(portonDe(tipo)))}</b><p>Definido por la administración para este tipo de acceso.</p></div>${S.user.rol==='inquilino'?`<p class="note">Tu acceso como inquilino vence el ${fFecha(S.user.hasta)}; el pase no puede pasar de esa fecha.</p>`:''}<button class="btn block">Crear pase</button></form>`)}
function crearPase(e,tipo){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();
  const p={id:uid(),casaId:S.user.casaId,creadoPor:S.user.id,tipo,nombre:g('nombre')||(tipo==='entrega'?'Repartidor':''),dui:g('dui'),detalle:g('detalle'),placa:g('placa'),horario:g('horario'),desde:g('desde'),hasta:g('hasta')||g('desde'),pin:genPin(),porton:portonDe(tipo),estado:'activo',ingresos:[]};
  if(!duiOk(p.dui))return toast('DUI incompleto. Formato: 00000000-0');if(p.hasta<p.desde)return toast('La fecha final es anterior a la inicial');if(p.hasta<ymd())return toast('El pase ya estaría vencido');
  if(S.user.rol==='inquilino'&&p.hasta>S.user.hasta)return toast('No puede pasar de tu fecha de vigencia');
  DB.pases.push(p);save();render();verPase(p.id,true)}
function textoPase(p){return `Pase de acceso · ${DB.residencial.nombre}\n${casaNom(p.casaId)}\n${TIPOS[p.tipo].l}: ${p.nombre}\nVálido: ${vigencia(p)}${p.horario?' ('+p.horario+')':''}\nPIN: ${p.pin}\nPresenta tu DUI en portería.`}
function verPase(id,nuevo){const p=DB.pases.find(x=>x.id===id);const e=estadoPase(p);const cr=usuario(p.creadoPor);const act=p.estado==='activo'&&p.hasta>=ymd();
  sheet(TIPOS[p.tipo].e+' '+esc(p.nombre),`${nuevo?alertBox('ok','Pase creado','Compártelo con la persona. Vigilancia lo verá en portería.'):''}<div class="card" style="text-align:center"><div class="muted sm">PIN de acceso</div><div class="pin" style="font-size:34px">${p.pin}</div>${chip(e.l,e.c)}</div>
  <div class="kv"><span>Tipo</span><b>${TIPOS[p.tipo].l}</b>${p.detalle?`<span>Detalle</span><b>${esc(p.detalle)}</b>`:''}${p.dui?`<span>DUI</span><b>${esc(p.dui)}</b>`:''}${p.placa?`<span>Placa</span><b>${esc(p.placa)}</b>`:''}<span>Ingresa por</span><b>🚪 ${esc(portonNom(p.porton))}</b><span>Vigencia</span><b>${vigencia(p)}</b>${p.horario?`<span>Horario</span><b>${esc(p.horario)}</b>`:''}<span>Creado por</span><b>${esc(cr?cr.nombre:'')}</b></div>
  ${p.ingresos.length?`<h3>Ingresos</h3>${p.ingresos.slice().reverse().slice(0,10).map(i=>`<div class="chk"><span class="grow">${fFecha(i.entrada)}</span><span class="sm muted">${i.salida?'salió '+hora(i.salida):'dentro'}</span></div>`).join('')}`:''}
  <div class="btns">${act?`<button class="btn" onclick="compartirPase('${p.id}')">${ic('share',18)} Compartir</button><button class="btn bad" onclick="cancelarPase('${p.id}')">Cancelar pase</button>`:''}</div>`)}
async function compartirPase(id){const p=DB.pases.find(x=>x.id===id);const t=textoPase(p);try{if(navigator.share){await navigator.share({text:t});return}}catch(e){return}try{await navigator.clipboard.writeText(t);toast('Copiado: pégalo en WhatsApp')}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}}
function cancelarPase(id){if(!confirm('¿Cancelar este pase? El PIN dejará de funcionar.'))return;const p=DB.pases.find(x=>x.id===id);p.estado='cancelado';save();closeSheet();render();toast('Pase cancelado')}

function vResPagos(){const cid=S.user.casaId;const cs=cuotasCasa(cid);const pend=cs.filter(c=>c.estado==='pendiente');
  if(!S.sel)S.sel=pend.map(c=>c.periodo);S.sel=S.sel.filter(p=>pend.some(c=>c.periodo===p));
  const sel=pend.filter(c=>S.sel.includes(c.periodo));const total=sum(sel,montoCuota);const m=moraCasa(cid);const b=DB.residencial.banco;

  if(m.length)h+=alertBox('bad',`En mora: ${m.length} mes(es) · ${money(sum(m,montoCuota))}`,`${m.map(c=>perL(c.periodo)).join(', ')}. Incluye recargo de ${money(DB.config.recargo)} por mes vencido.`);
  else if(pend.length)h+=alertBox('warn','Cuota pendiente',`Vence el ${fFecha(vence(periodoActual()))}.`);
  else h+=alertBox('ok','Estás al día ✓','');

    const st=c.estado==='pagado'?['Pagado','ok']:['En revisión','info'];return `<div class="chk"><span style="width:22px;text-align:center">${c.estado==='pagado'?'✓':'⏳'}</span><span class="grow muted">${perL(c.periodo)} ${chip(st[0],st[1])}</span><b class="muted">${money(c.monto)}</b></div>`}).join('')}</div>`;
  if(pend.length)h+=`<div class="card"><div class="row"><span class="grow">Total seleccionado (${sel.length} mes${sel.length===1?'':'es'})</span><b style="font-size:21px">${money(total)}</b></div><div class="btns"><button class="btn" onclick="pagarLink()">Pagar en línea</button><button class="btn sec" onclick="pagarTransf()">Ya transferí · adjuntar</button></div><button class="btn ghost block" onclick="pedirCobro('${cid}')">🧾 Que el cobrador pase a mi casa</button></div>`;
  h+=visitaRes(cid);
  h+=`<h3>Cuenta para transferencias</h3><div class="card kv"><span>Banco</span><b>${esc(b.banco)}</b><span>Tipo</span><b>${esc(b.tipo)}</b><span>Número</span><b>${esc(b.numero)}</b><span>Titular</span><b>${esc(b.titular)}</b><span>Concepto</span><b>${casaNom(cid)} + mes(es)</b></div>`;
  const ps=DB.pagos.filter(p=>p.casaId===cid).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  h+=`<h3>Historial de pagos</h3>${ps.map(p=>pagoCard(p,false)).join('')||empty('Sin pagos registrados')}`;return h}
function toggleSel(p){S.sel=S.sel.includes(p)?S.sel.filter(x=>x!==p):[...S.sel,p];render()}
function selCuotas(){return pendCasa(S.user.casaId).filter(c=>S.sel&&S.sel.includes(c.periodo))}

  S.link={periodos:cs.map(x=>x.periodo),total,ref,conc};
  sheet('Link de pago',`<div class="card" style="border:2px solid var(--pri)"><div class="muted sm" style="margin-bottom:8px">Detalle del cobro</div><div class="kv"><span>Residencial</span><b>${esc(DB.residencial.nombre)}</b><span>Casa</span><b>${casaNom(c.id)} · ${esc(c.pasaje)}</b><span>Concepto</span><b>${esc(conc)}</b><span>Monto</span><b style="font-size:19px">${money(total)}</b><span>Referencia</span><b>${ref}</b></div></div>
  <ol class="note" style="padding-left:18px"><li>Toca <b>Ir a pagar</b> y completa el pago en la pasarela.</li><li>Regresa y toca <b>Ya pagué</b>: la app genera la captura con este detalle y la adjunta al mes correspondiente.</li></ol>
  <button class="btn block" onclick="abrirLink()">Ir a pagar</button><button class="btn sec block" onclick="confirmarLink()">Ya pagué · adjuntar captura</button>`)}

  const cs=selCuotas();registrarPago({casaId:S.user.casaId,periodos:cs.map(c=>c.periodo),monto:sum(cs,montoCuota),metodo:'transferencia',ref:f.get('ref'),banco:f.get('banco'),fechaTransf:f.get('fecha'),comprobante:comp});closeSheet();toast('Comprobante enviado para validación')}
function registrarPago(o){const p=Object.assign({id:uid(),fecha:nowISO(),estado:'revision',usuarioId:S.user.id},o);DB.pagos.unshift(p);

  notificar(admins(),'💳 Pago por validar',`${casaNom(o.casaId)} · ${o.periodos.map(perL).join(', ')} · ${money(o.monto)} (${METODO[o.metodo]})`,{tab:'pagos'});S.sel=null;save();render()}

function vVigInicio(){const h=ymd();const esp=DB.autorizaciones.filter(a=>a.estado==='esperando');const resp=DB.autorizaciones.filter(a=>a.estado!=='esperando'&&(a.fechaResp||'').slice(0,10)===h).sort((a,b)=>b.fechaResp.localeCompare(a.fechaResp)).slice(0,5);
  if(!S.gate){try{S.gate=localStorage.getItem(KEY+'_gate')}catch(e){}S.gate=S.gate||'todos'}const G=p=>S.gate==='todos'||p.porton===S.gate;const den=DB.pases.filter(p=>dentro(p)&&G(p));const exp=DB.pases.filter(p=>vigenteHoy(p)&&!dentro(p)&&G(p));
  return `<h2>Portería</h2><label class="f">Estoy en<select onchange="S.gate=this.value;try{localStorage.setItem(KEY+'_gate',this.value)}catch(e){};render()"><option value="todos">Todos los portones</option>${portones().map(p=>`<option value="${p.id}" ${S.gate===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><input id="qv" placeholder="Buscar por PIN, nombre o N° de casa" inputmode="search" oninput="document.getElementById('rv').innerHTML=buscarVig(this.value)"><div id="rv" style="margin-top:8px"></div>
  ${esp.length?`<h3>Esperando respuesta del residente</h3>${esp.map(a=>`<div class="item">${tAv(a.tipo)}<div class="grow"><b>${esc(a.nombre)}</b><div class="sm muted">${casaNom(a.casaId)} · enviado ${hora(a.fecha)}</div></div>${chip('Esperando','warn')}</div>`).join('')}`:''}
  ${resp.length?`<h3>Respuestas de residentes</h3>${resp.map(a=>`<div class="item">${tAv(a.tipo)}<div class="grow"><b>${esc(a.nombre)}</b><div class="sm muted">${casaNom(a.casaId)} · ${hora(a.fechaResp)}</div></div>${a.estado==='aprobado'?`<button class="btn ok smb" onclick="verPaseVig('${a.paseId}')">Autorizado ›</button>`:chip('Rechazado','bad')}</div>`).join('')}`:''}
  <h3>Dentro de la colonia (${den.length})</h3>${den.map(paseItemVig).join('')||empty('Nadie dentro')}
  <h3>Esperados hoy (${exp.length})</h3>${exp.map(paseItemVig).join('')||empty('Sin pases para hoy')}`}
function paseItemVig(p){const e=estadoPase(p);return `<button class="item" onclick="verPaseVig('${p.id}')">${tAv(p.tipo)}<div class="grow"><b>${esc(p.nombre)}</b> <span class="sm muted">· ${casaNom(p.casaId)}</span><div class="sm muted">${TIPOS[p.tipo].l}${p.detalle?' · '+esc(p.detalle):''}</div><div class="sm">🚪 ${esc(portonNom(p.porton))}</div></div>${chip(e.l,e.c)}</button>`}
function buscarVig(q){q=q.trim().toLowerCase();if(!q)return'';const l=DB.pases.filter(p=>(vigenteHoy(p)||dentro(p))&&(p.pin===q||p.nombre.toLowerCase().includes(q)||('casa '+casa(p.casaId).numero)===q||casa(p.casaId).numero===q));
  const inv=DB.pases.filter(p=>p.pin===q&&!vigenteHoy(p)&&!dentro(p));
  return l.map(paseItemVig).join('')+(inv.length?alertBox('bad','PIN no válido hoy',`Pase ${estadoPase(inv[0]).l.toLowerCase()} · ${casaNom(inv[0].casaId)}. No permitir el ingreso; usa “Sin pase” para pedir autorización.`):'')+(!l.length&&!inv.length?empty('Sin coincidencias. Usa “Sin pase” para pedir autorización al residente.'):'')}
function verPaseVig(id){const p=DB.pases.find(x=>x.id===id);if(!p)return;const e=estadoPase(p);const cr=usuario(p.creadoPor);const d=dentro(p),ok=vigenteHoy(p);
  sheet(TIPOS[p.tipo].e+' Validar acceso',`<div style="text-align:center;margin-bottom:12px"><div style="font-size:22px;font-weight:800">${esc(p.nombre)}</div><div class="muted">${casaNom(p.casaId)} · ${esc(casa(p.casaId).pasaje)}</div><div style="margin-top:6px">${chip(e.l,e.c)}</div></div>
  <div class="card kv"><span>Tipo</span><b>${TIPOS[p.tipo].l}</b>${p.detalle?`<span>Detalle</span><b>${esc(p.detalle)}</b>`:''}<span>DUI</span><b>${esc(p.dui||'No registrado')}</b>${p.placa?`<span>Placa</span><b>${esc(p.placa)}</b>`:''}<span>Ingresa por</span><b>🚪 ${esc(portonNom(p.porton))}</b><span>Vigencia</span><b>${vigencia(p)}</b>${p.horario?`<span>Horario</span><b>${esc(p.horario)}</b>`:''}<span>Autorizó</span><b>${esc(cr?cr.nombre:'')} (${cr?ROL[cr.rol]:''})</b><span>PIN</span><b>${p.pin}</b></div>
  ${S.gate&&S.gate!=='todos'&&p.porton&&p.porton!==S.gate&&!d?alertBox('warn','Portón diferente','Este acceso está asignado a '+esc(portonNom(p.porton))+'. Indícale a la persona por dónde debe entrar o confirma con el residente.'):''}${!d&&ok?`<p class="note">✔ Pide el DUI y verifica que el nombre${p.dui?' y número':''} coincidan antes de marcar el ingreso.</p><button class="btn ok block big-ok" onclick="marcarIngreso('${p.id}')">${ic('check',20)} La persona ingresó a la colonia</button>`:''}
  ${d?`<button class="btn block big-ok" onclick="marcarSalida('${p.id}')">${ic('out',20)} Marcar salida</button>`:''}
  ${!d&&!ok?alertBox('bad','Pase no vigente hoy','No permitir el ingreso sin autorización del residente.'):''}`)}
function marcarIngreso(id){const p=DB.pases.find(x=>x.id===id);if(dentro(p))return;const t=nowISO(),g=(S.gate&&S.gate!=='todos')?S.gate:p.porton;p.ingresos.push({entrada:t,salida:null,guardiaId:S.user.id,porton:g});
  notificar(usuariosCasa(p.casaId),'✅ Ingresó: '+p.nombre,`${TIPOS[p.tipo].l} ingresó por ${portonNom(g)} a las ${hora(t)} · Validado por ${S.user.nombre}`,{tab:'accesos'});save();closeSheet();render();toast('Ingreso registrado · residente notificado')}
function marcarSalida(id){const p=DB.pases.find(x=>x.id===id);const l=p.ingresos[p.ingresos.length-1];if(!l||l.salida)return;l.salida=nowISO();
  notificar(usuariosCasa(p.casaId),'👋 Salió: '+p.nombre,`Salió de la colonia a las ${hora(l.salida)}`,{tab:'accesos'});save();closeSheet();render();toast('Salida registrada')}
function vSinPase(){return `<h2>Persona sin pase</h2><p class="note" style="margin-top:-6px">Envía una solicitud al residente. Cuando autorice, aparecerá en Portería para marcar el ingreso.</p><form class="card" onsubmit="solicitarAut(event)"><label class="f">Casa<select name="casa" required>${DB.casas.filter(c=>c.duenoId).map(c=>`<option value="${c.id}">${casaNom(c.id)} · ${esc(c.pasaje)} · ${esc(duenoNom(c.id))}</option>`).join('')}</select></label><label class="f">Tipo<select name="tipo">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}">${t.e} ${t.l}</option>`).join('')}</select></label><label class="f">Nombre / empresa<input name="nombre" required></label><div class="two"><label class="f">DUI<input name="dui" inputmode="numeric" maxlength="10" autocomplete="off"></label><label class="f">Placa<input name="placa"></label></div><label class="f">Portón<select name="porton">${portones().map(x=>`<option value="${x.id}" ${S.gate===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label><label class="f">Motivo<input name="motivo" placeholder="Ej. Entrega de paquete"></label><button class="btn block">Pedir autorización</button></form>`}
function solicitarAut(e){e.preventDefault();const f=new FormData(e.target);if(!duiOk(String(f.get('dui')||'').trim()))return toast('DUI incompleto. Formato: 00000000-0');const a={id:uid(),casaId:f.get('casa'),nombre:f.get('nombre'),dui:f.get('dui'),tipo:f.get('tipo'),motivo:f.get('motivo'),placa:f.get('placa'),porton:f.get('porton'),estado:'esperando',fecha:nowISO(),guardiaId:S.user.id};DB.autorizaciones.unshift(a);
  notificar(usuariosCasa(a.casaId),TIPOS[a.tipo].e+' Autorización solicitada',`Vigilancia pide autorizar el ingreso de: ${a.nombre}${a.motivo?' ('+a.motivo+')':''}.`,{tab:'inicio'});save();go('inicio');toast('Solicitud enviada al residente')}

function seedVacia(r){const i=r.init||{},ct=r.contacto||{};const per=periodoActual();const pols=String(i.poligonos||'A').split(',').map(x=>x.trim()).filter(Boolean);const n=Math.max(1,+i.casas||10);const por=Math.ceil(n/pols.length);

  for(let k=0;k<n;k++){const p=pols[Math.min(pols.length-1,Math.floor(k/por))];d.casas.push({id:'c'+(k+1),numero:String(k%por+1),pasaje:/^pol/i.test(p)?p:'Polígono '+p,familia:'',duenoId:null,codigo:genCodigo()})}

function leerDB(id){if(id===RES)return DB;try{return JSON.parse(localStorage.getItem(dbKey(id)))}catch(e){return null}}
function resStats(r){const d=leerDB(r.id);if(!d)return{casas:(r.init&&+r.init.casas)||0,usuarios:1,mora:0,conDueno:0};const h=ymd();
  const mora=new Set(d.cuotas.filter(q=>q.estado==='pendiente'&&h>q.periodo+'-'+pad(d.config.diaVence)).map(q=>q.casaId)).size;
  return{casas:d.casas.length,usuarios:d.usuarios.filter(u=>u.activo).length,mora,conDueno:d.casas.filter(c=>c.duenoId).length}}

function guardarRes(e,id){e.preventDefault();const f=new FormData(e.target);const g=k=>String(f.get(k)||'').trim();const D=leerDir(f);if(D.err)return toast(D.err);const r=PLAT.residenciales.find(x=>x.id===id);const d=leerDB(id);
  const ad=d.usuarios.find(u=>u.rol==='admin');const un=g('adminUser').toLowerCase();if(d.usuarios.some(u=>u!==ad&&u.user.toLowerCase()===un))return toast('Ese usuario ya lo usa otra persona de la residencial');
  // casas
  const n=Math.max(1,+g('casas')),cur=d.casas.length;let msgC='';
  if(n>cur){const pol=normPol(g('polNuevo'))||'Polígono A';let max=Math.max(0,...d.casas.filter(c=>c.pasaje.toLowerCase()===pol.toLowerCase()).map(c=>parseInt(c.numero)||0));const per=periodoActual();const desde=ymd()<=per+'-'+pad(d.config.diaVence)?per:addMonths(per,1);
    for(let k=0;k<n-cur;k++)d.casas.push({id:'c'+uid(),numero:String(++max),pasaje:pol,familia:'',duenoId:null,codigo:genCodigo(),desde});msgC=` · ${n-cur} casa(s) nuevas en ${pol}`}
  if(n<cur){const libres=d.casas.filter(c=>!c.duenoId&&!d.pagos.some(p=>p.casaId===c.id)).reverse();if(libres.length<cur-n)return toast(`Solo se pueden quitar ${libres.length} casa(s): las demás tienen propietario o pagos`);
    const fuera=new Set(libres.slice(0,cur-n).map(c=>c.id));d.casas=d.casas.filter(c=>!fuera.has(c.id));d.cuotas=d.cuotas.filter(q=>!fuera.has(q.casaId));msgC=` · ${cur-n} casa(s) quitadas`}
  // cuota
  d.config.cuota=+g('cuota');d.config.diaVence=Math.min(28,Math.max(1,+g('diaVence')||10));const per=periodoActual();d.cuotas.forEach(q=>{if(q.periodo>per&&q.estado==='pendiente')q.monto=d.config.cuota});
  // admin
  if(ad){ad.nombre=g('adminNombre')||ad.nombre;ad.user=un;ad.tel=g('ct');if(g('adminPass'))ad.pass=g('adminPass')}
  const eq=(d.residencial.equipo||[]).find(m=>m.cargo==='Administrador(a)');if(eq){eq.nombre=g('adminNombre')||eq.nombre;eq.telefono=g('ct');eq.email=g('ce')}
  d.residencial.nombre=g('nombre');d.residencial.municipio=D.municipio;d.residencial.direccion=D.direccion;d.residencial.pais=D.pais;d.residencial.dir=D.dir;r.pais=D.pais;r.dir=D.dir;d.residencial.tipo=g('tipo')||'residencial';r.tipo=d.residencial.tipo;
  r.nombre=g('nombre');r.municipio=D.municipio;r.contacto={nombre:g('adminNombre'),tel:g('ct'),email:g('ce')};r.plan=g('plan');r.estado=g('estado');r.vencePrueba=r.estado==='prueba'?g('vp'):(r.vencePrueba||'');
  if(r.init){r.init.adminUser=un;if(g('adminPass'))r.init.adminPass=g('adminPass')}
  escribirDB(id,d);if(id===RES)ensureCuotas(),save();savePlat();closeSheet();render();toast('Residencial actualizada'+msgC)}

  sheet('Eliminar residencial',`<div class="alert bad"><b>Esta acción no se puede deshacer</b><p>Se borran ${st.casas} casas, ${st.usuarios} usuarios, pagos, accesos, avisos y reclamos de <b>${esc(r.nombre)}</b>. Nadie de esa residencial podrá volver a entrar.</p></div><p class="note">Si solo quieres bloquear el acceso por falta de pago, mejor cambia el estado a <b>Suspendida</b>.</p><label class="f">Escribe el nombre de la residencial para confirmar<input id="delConf" autocomplete="off" placeholder="${esc(r.nombre)}" oninput="document.getElementById('delBtn').disabled=this.value.trim().toLowerCase()!=='${esc(r.nombre.toLowerCase()).replace(/'/g,"\\'")}'"></label><button id="delBtn" class="btn bad block" disabled onclick="eliminarResOk('${id}')">Eliminar definitivamente</button><button class="btn ghost block" onclick="closeSheet()">Cancelar</button>`)}

const cobradores=()=>DB.usuarios.filter(u=>u.rol==='cobrador'&&u.activo);
const montoVisita=v=>sum(pendCasa(v.casaId).filter(c=>v.periodos.includes(c.periodo)),montoCuota);
function pedirCobro(cid){const pend=pendCasa(cid);if(!pend.length)return toast('No hay cuotas pendientes');if(DB.visitasCobro.some(v=>v.casaId===cid&&v.estado==='pendiente'))return toast('Ya hay un cobro a domicilio programado para esta casa');
  const pre=S.user.rol==='residente'&&S.sel&&S.sel.length?S.sel:pend.map(c=>c.periodo);const adm=S.user.rol==='admin';
  sheet('Cobro a domicilio · '+casaNom(cid),`<p class="note">El cobrador llega a la casa, recibe el pago y entrega el recibo físico o digital.</p><div class="card">${pend.map(c=>`<label class="chk"><input type="checkbox" name="per" value="${c.periodo}" ${pre.includes(c.periodo)?'checked':''}><span class="grow">${perL(c.periodo)} ${vencida(c)?chip('Vencido','bad'):''}</span><b>${money(montoCuota(c))}</b></label>`).join('')}</div>
  <form onsubmit="crearVisita(event,'${cid}')"><div class="two"><label class="f">Fecha<input name="fecha" type="date" value="${ymd()}" min="${ymd()}" required></label><label class="f">Horario<select name="franja">${Object.entries(FRANJAS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label></div><label class="f">Recibo<select name="recibo">${Object.entries(RECIBO).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>${adm&&cobradores().length?`<label class="f">Cobrador<select name="cob"><option value="">Cualquier cobrador</option>${cobradores().map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select></label>`:''}<label class="f">Indicaciones (opcional)<input name="nota" placeholder="Ej. Tocar el timbre, preguntar por Ana"></label><button class="btn block">${adm?'Programar cobro':'Solicitar cobrador'}</button></form>`)}
function crearVisita(e,cid){e.preventDefault();const ps=perSel();if(!ps.length)return toast('Selecciona al menos un mes');const f=new FormData(e.target);
  const v={id:uid(),casaId:cid,periodos:ps,fecha:f.get('fecha'),franja:f.get('franja'),recibo:f.get('recibo'),nota:f.get('nota')||'',cobradorId:f.get('cob')||'',estado:'pendiente',solicitadoPor:S.user.id,creada:nowISO()};DB.visitasCobro.unshift(v);
  const txt=`${casaNom(cid)} · ${fFecha(v.fecha)} · ${FRANJAS[v.franja]} · ${ps.map(perC).join(', ')}`;
  notificar(v.cobradorId?[v.cobradorId]:cobradores().map(u=>u.id),'🧾 Nuevo cobro a domicilio',txt,{tab:'inicio'});
  if(S.user.rol==='admin')notificar(duenoIds(cid),'🧾 Cobro a domicilio programado',`El cobrador pasará el ${fFecha(v.fecha)} (${FRANJAS[v.franja]}).`,{tab:'pagos'});else notificar(admins(),'🧾 Solicitud de cobro a domicilio',txt,{tab:'cobros'});
  save();closeSheet();render();toast(S.user.rol==='admin'?'Cobro programado':'Listo, el cobrador pasará a tu casa')}
function cancelarVisita(id){const v=DB.visitasCobro.find(x=>x.id===id);v.estado='cancelada';notificar(v.cobradorId?[v.cobradorId]:cobradores().map(u=>u.id),'Cobro cancelado',casaNom(v.casaId)+' canceló el cobro a domicilio.');save();render();toast('Cobro a domicilio cancelado')}
function visitaRes(cid){return DB.visitasCobro.filter(v=>v.casaId===cid&&v.estado==='pendiente').map(v=>`<div class="card" style="border:2px solid var(--info)"><b>🧾 Cobro a domicilio programado</b><div class="sm">${fFecha(v.fecha)} · ${FRANJAS[v.franja]} · ${v.periodos.map(perC).join(', ')} · ${money(montoVisita(v))}</div><div class="sm muted">Cobrador: ${v.cobradorId?esc(usuario(v.cobradorId).nombre):'por asignar'} · Recibo ${RECIBO[v.recibo].toLowerCase()}</div><div class="btns"><button class="btn ghost smb" onclick="cancelarVisita('${v.id}')">Cancelar cobro a domicilio</button></div></div>`).join('')}
const ORD_F={manana:0,tarde:1,noche:2};
function vCobRuta(){const me=S.user.id,h=ymd();S.rf=S.rf||'hoy';let l=DB.visitasCobro.filter(v=>v.estado==='pendiente'&&(!v.cobradorId||v.cobradorId===me));const all=l.length;if(S.rf==='hoy')l=l.filter(v=>v.fecha<=h);
  l.sort((a,b)=>a.fecha.localeCompare(b.fecha)||ORD_F[a.franja]-ORD_F[b.franja]);const caja=cajaDe(me);const atr=caja.some(p=>p.fecha.slice(0,10)<h);
  return `<h2>Ruta de cobro</h2>${atr?alertBox('bad','Tienes cobros sin cierre de días anteriores','Envía tu cierre y entrega el efectivo a la administración.',"go('caja')"):''}<div class="kpis">${kpi('Visitas para hoy',DB.visitasCobro.filter(v=>v.estado==='pendiente'&&(!v.cobradorId||v.cobradorId===me)&&v.fecha<=h).length,"S.rf='hoy';render()")}${kpi('En mi caja',money(sum(caja,p=>p.monto)),"go('caja')")}</div>${seg('rf',[['hoy','Hoy y atrasadas'],['todas',`Todas (${all})`]])}${l.map(visitaCard).join('')||empty('Sin visitas pendientes')}<button class="btn ghost block" onclick="cobrarOtra()">Cobrar a una casa sin solicitud</button>`}
function visitaCard(v){const c=casa(v.casaId),d=usuario(c.duenoId),h=ymd();const tel=d&&d.tel||'';return `<div class="card"><div class="row"><div class="av" style="font-size:${String(c.numero).length>3?11:18}px;letter-spacing:-.02em">${esc(c.numero)}</div><div class="grow"><b>${casaNom(c.id)}</b> <span class="sm muted">· ${esc(c.pasaje)}</span><div class="sm muted">${c.familia?'Fam. '+esc(c.familia)+' · ':''}${esc(d?d.nombre:'')}</div>${tel?`<a class="sm" href="tel:${esc(tel)}">${ic('phone',13)} ${esc(tel)}</a>`:''}</div><div class="right"><b style="font-size:18px">${money(montoVisita(v))}</b></div></div>
  <div class="months">${chip(v.fecha<h?'Atrasada · '+fFecha(v.fecha):v.fecha===h?'Hoy':fFecha(v.fecha),v.fecha<h?'bad':v.fecha===h?'warn':'info')}${chip(FRANJAS[v.franja])}${chip('Recibo '+RECIBO[v.recibo].split(' ')[0].toLowerCase())}</div><div class="months">${v.periodos.map(p=>chip(perL(p),'bad')).join('')}</div>${v.nota?`<div class="sm" style="margin-top:6px">📝 ${esc(v.nota)}</div>`:''}
  <div class="btns"><button class="btn ok" onclick="cobrarCasa('${c.id}','${v.id}')">Registrar cobro</button><button class="btn ghost" onclick="falloVisita('${v.id}')">No se pudo cobrar</button></div></div>`}
function falloVisita(id){sheet('No se pudo cobrar',`<form onsubmit="falloOk(event,'${id}')"><label class="f">Motivo<select name="m"><option>No había nadie en casa</option><option>Pidió otra fecha</option><option>No tenía el dinero completo</option><option>Otro</option></select></label><label class="f">Reprogramar para (opcional)<input name="f" type="date" min="${ymd()}"></label><button class="btn block">Guardar</button></form>`)}
function falloOk(e,id){e.preventDefault();const f=new FormData(e.target);const v=DB.visitasCobro.find(x=>x.id===id);v.intentos=v.intentos||[];v.intentos.push({fecha:nowISO(),motivo:f.get('m'),por:S.user.id});
  if(f.get('f')){v.fecha=f.get('f');notificar(duenoIds(v.casaId),'🧾 Cobro reprogramado',`${f.get('m')}. El cobrador volverá el ${fFecha(v.fecha)}.`,{tab:'pagos'})}else{v.estado='fallida';notificar(duenoIds(v.casaId),'🧾 No se pudo realizar el cobro',f.get('m')+'. Puedes solicitarlo de nuevo desde Pagos.',{tab:'pagos'})}
  notificar(admins(),'Cobro no realizado · '+casaNom(v.casaId),f.get('m'),{tab:'cobros'});save();closeSheet();render();toast('Guardado')}
function cobrarOtra(){sheet('Cobrar a una casa',`<label class="f">Casa<select id="cobCasa">${DB.casas.filter(c=>pendCasa(c.id).length).map(c=>`<option value="${c.id}">${casaNom(c.id)} · ${esc(c.pasaje)} · ${esc(duenoNom(c.id))}</option>`).join('')}</select></label><button class="btn block" onclick="cobrarCasa(document.getElementById('cobCasa').value)">Continuar</button>`)}
function cobrarCasa(cid,vid){const v=vid&&DB.visitasCobro.find(x=>x.id===vid);const pend=pendCasa(cid);if(!pend.length)return toast('Esta casa ya no tiene cuotas pendientes');const pre=v?v.periodos:pend.filter(vencida).map(c=>c.periodo);
  sheet('Registrar cobro · '+casaNom(cid),`<div class="sm muted" style="margin-bottom:8px">${esc(duenoNom(cid))} · ${esc(casaDesc(casa(cid)))}</div><div class="card">${pend.map(c=>`<label class="chk"><input type="checkbox" name="per" value="${c.periodo}" ${pre.includes(c.periodo)?'checked':''} onchange="totCobro('${cid}')"><span class="grow">${perL(c.periodo)} ${vencida(c)?chip('Vencido','bad'):''}</span><b>${money(montoCuota(c))}</b></label>`).join('')}</div><div class="card row"><span class="grow">Total a recibir</span><b id="totc" style="font-size:22px"></b></div>
  <form onsubmit="guardarCobro(event,'${cid}','${vid||''}')"><div class="two"><label class="f">Forma de pago<select name="forma"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option></select></label><label class="f">Recibo<select name="recibo">${Object.entries(RECIBO).map(([k,l])=>`<option value="${k}" ${v&&v.recibo===k?'selected':''}>${l}</option>`).join('')}</select></label></div><label class="f">N° de recibo del talonario (si entregas físico)<input name="talonario" inputmode="numeric"></label><button class="btn ok block big-ok">${ic('check',20)} Confirmar cobro</button></form>`);totCobro(cid)}
function totCobro(cid){const ps=perSel();const t=document.getElementById('totc');if(t)t.textContent=money(sum(pendCasa(cid).filter(c=>ps.includes(c.periodo)),montoCuota))}
function guardarCobro(e,cid,vid){e.preventDefault();const ps=perSel();if(!ps.length)return toast('Selecciona al menos un mes');const f=new FormData(e.target);const cs=pendCasa(cid).filter(c=>ps.includes(c.periodo));
  if(f.get('recibo')!=='digital'&&!String(f.get('talonario')).trim())return toast('Escribe el número del recibo físico');
  DB.reciboSeq=(DB.reciboSeq||0)+1;const num='C-'+String(DB.reciboSeq).padStart(5,'0');
  const p={id:uid(),casaId:cid,periodos:ps,monto:sum(cs,montoCuota),metodo:'cobrador',forma:f.get('forma'),ref:num,talonario:String(f.get('talonario')).trim(),recibo:f.get('recibo'),fecha:nowISO(),fechaAprob:nowISO(),estado:'aprobado',usuarioId:S.user.id,aprobadoPor:S.user.id,cobradorId:S.user.id,cierreId:null,comprobante:null};
  DB.pagos.unshift(p);cs.forEach(c=>c.estado='pagado');if(vid){const v=DB.visitasCobro.find(x=>x.id===vid);if(v){v.estado='cobrada';v.pagoId=p.id}}
  DB.visitasCobro.filter(v=>v.casaId===cid&&v.estado==='pendiente'&&v.periodos.every(x=>ps.includes(x))).forEach(v=>{v.estado='cobrada';v.pagoId=p.id});
  notificar(duenoIds(cid),p.recibo==='fisico'?'✅ Pago recibido por el cobrador':'🧾 Recibo digital '+num,`Pagaste ${ps.map(perL).join(', ')} por ${money(p.monto)} a ${S.user.nombre}.${p.talonario?' Recibo físico N° '+p.talonario+'.':''}`,{tab:'pagos'});
  notificar(admins(),'🧾 Cobro en calle · '+casaNom(cid),`${money(p.monto)} · ${num} · ${S.user.nombre}`,{tab:'cobros'});save();render();reciboCobro(p.id)}
function reciboCobro(id){const p=pago(id),c=casa(p.casaId),cb=usuario(p.cobradorId),d=usuario(c.duenoId);
  const img=genImg({titulo:'Recibo de pago',sub:DB.residencial.nombre,filas:[['Recibo N°',p.ref+(p.talonario?' · talonario '+p.talonario:'')],['Casa',casaNom(c.id)+' · '+c.pasaje],['Propietario',duenoNom(c.id)],['Concepto','Cuota de mantenimiento: '+p.periodos.map(perL).join(', ')],['Monto',money(p.monto)+' · '+(p.forma==='cheque'?'Cheque':'Efectivo')],['Cobrador',cb?cb.nombre:''],['Fecha',fFecha(p.fecha)]],sello:'CANCELADO'});
  const tel=(d&&d.tel||'').replace(/\D/g,'');const txt=encodeURIComponent(`${DB.residencial.nombre}\nRecibo ${p.ref} · ${casaNom(c.id)}\n${p.periodos.map(perL).join(', ')}\nTotal: ${money(p.monto)}\nCobrador: ${cb?cb.nombre:''}`);
  sheet('Cobro registrado',`<img class="thumb" src="${img}" alt="Recibo">${p.recibo!=='fisico'?`<p class="note">El recibo digital ya está en la app del residente.</p><a class="btn sec block" target="_blank" rel="noopener" href="https://wa.me/${tel?telCode()+tel:''}?text=${txt}">Enviar también por WhatsApp</a>`:''}${p.recibo!=='digital'?`<p class="note">Entrega el recibo físico N° ${esc(p.talonario)}.</p>`:''}<button class="btn block" onclick="closeSheet()">Listo</button>`)}
const cajaDe=uid_=>DB.pagos.filter(p=>p.metodo==='cobrador'&&p.cobradorId===uid_&&!p.cierreId&&p.estado==='aprobado').sort((a,b)=>a.fecha.localeCompare(b.fecha));
function filaCobro(p){return `<div class="chk"><span class="grow"><b>${casaNom(p.casaId)}</b> <span class="sm muted">· ${esc(p.ref)}${p.talonario?' · tal. '+esc(p.talonario):''} · ${fFecha(p.fecha)}</span><div class="sm muted">${p.periodos.map(perC).join(', ')} · ${p.forma==='cheque'?'Cheque':'Efectivo'}</div></span><b>${money(p.monto)}</b></div>`}
function vCobCaja(){const caja=cajaDe(S.user.id);const ef=sum(caja.filter(p=>p.forma!=='cheque'),p=>p.monto),ch=sum(caja.filter(p=>p.forma==='cheque'),p=>p.monto);
  return `<h2>Mi caja</h2><p class="note" style="margin-top:-6px">Cobros que aún no has entregado. Al final del día envía el cierre y entrega el dinero a la administración.</p><div class="kpis">${kpi('Efectivo',money(ef),'')}${kpi('Cheques',money(ch),'')}</div><h3>${caja.length} recibo(s) · total ${money(ef+ch)}</h3><div class="card">${caja.map(filaCobro).join('')||empty('No tienes cobros pendientes de cierre')}</div>
  ${caja.length?`<form class="card" onsubmit="crearCierre(event)"><label class="f">Efectivo que entregas (contado)<input name="declarado" type="number" step="0.01" min="0" value="${ef.toFixed(2)}" required></label><label class="f">Nota (opcional)<input name="nota" placeholder="Ej. Billete de $20 en mal estado"></label><button class="btn block">Enviar cierre del día</button></form>`:''}`}
function crearCierre(e){e.preventDefault();const f=new FormData(e.target);const caja=cajaDe(S.user.id);if(!caja.length)return;
  const c={id:uid(),cobradorId:S.user.id,fecha:nowISO(),pagos:caja.map(p=>p.id),total:sum(caja,p=>p.monto),efectivo:sum(caja.filter(p=>p.forma!=='cheque'),p=>p.monto),cheques:sum(caja.filter(p=>p.forma==='cheque'),p=>p.monto),declarado:+f.get('declarado'),nota:f.get('nota')||'',estado:'enviado'};
  DB.cierres.unshift(c);caja.forEach(p=>p.cierreId=c.id);notificar(admins(),'💵 Cierre de cobrador por cuadrar',`${S.user.nombre} · ${caja.length} recibo(s) · ${money(c.total)}`,{tab:'cobros'});save();render();toast('Cierre enviado a la administración')}
const EST_C={enviado:{l:'Por cuadrar',c:'warn'},cuadrado:{l:'Cuadrado',c:'ok'},diferencia:{l:'Con diferencia',c:'bad'}};
function cierreCard(c,adm){const cb=usuario(c.cobradorId);const ps=c.pagos.map(pago).filter(Boolean);const e=EST_C[c.estado];
  return `<div class="card"><div class="row"><div class="grow"><b>${adm?esc(cb?cb.nombre:''):'Cierre '+fFecha(c.fecha).split(' · ')[0]}</b> ${chip(e.l,e.c)}<div class="sm muted">${fFecha(c.fecha)} · ${ps.length} recibo(s)</div></div><b style="font-size:18px">${money(c.total)}</b></div>
  <div class="kv" style="margin-top:10px"><span>Según recibos</span><b>${money(c.total)} (efectivo ${money(c.efectivo)}${c.cheques?', cheques '+money(c.cheques):''})</b><span>Cobrador entrega</span><b>${money(c.declarado)}</b>${c.estado!=='enviado'?`<span>Administración recibió</span><b>${money(c.recibido)}</b><span>Diferencia</span><b style="color:var(${Math.abs(c.dif)<0.005?'--ok':'--bad'})">${money(c.dif)}</b>`:''}</div>${c.nota?`<div class="sm" style="margin-top:6px">Cobrador: ${esc(c.nota)}</div>`:''}${c.notaAdmin?`<div class="sm">Administración: ${esc(c.notaAdmin)}</div>`:''}
  <details style="margin-top:8px"><summary class="sm">Ver recibos</summary>${ps.map(filaCobro).join('')}</details>
  ${adm&&c.estado==='enviado'?`<div class="two" style="margin-top:10px"><label class="f">Efectivo recibido${c.cheques?' + cheques':''}<input id="rec-${c.id}" type="number" step="0.01" value="${(c.declarado+c.cheques).toFixed(2)}"></label><label class="f">Nota<input id="nota-${c.id}"></label></div><button class="btn ok block" onclick="cuadrarCierre('${c.id}')">Cuadrar cierre</button>`:''}</div>`}
function cuadrarCierre(id){const c=DB.cierres.find(x=>x.id===id);const rec=+document.getElementById('rec-'+id).value;c.recibido=rec;c.dif=Math.round((rec-c.total)*100)/100;c.estado=Math.abs(c.dif)<0.005?'cuadrado':'diferencia';c.notaAdmin=document.getElementById('nota-'+id).value;c.revisadoPor=S.user.id;c.fechaRev=nowISO();
  notificar([c.cobradorId],c.estado==='cuadrado'?'✅ Cierre cuadrado':'⚠️ Cierre con diferencia',c.estado==='cuadrado'?`Tu cierre de ${money(c.total)} cuadró.`:`Diferencia de ${money(c.dif)}. ${c.notaAdmin||''}`,{tab:'cierres'});save();render();toast(c.estado==='cuadrado'?'Cierre cuadrado':'Cierre guardado con diferencia de '+money(c.dif))}
function vCobCierres(){const l=DB.cierres.filter(c=>c.cobradorId===S.user.id);return `<h2>Mis cierres</h2>${l.map(c=>cierreCard(c,false)).join('')||empty('Aún no has enviado cierres')}`}
function vAdmCobros(){S.cseg=S.cseg||'cierres';const vis=DB.visitasCobro.filter(v=>v.estado==='pendiente');const pc=DB.cierres.filter(c=>c.estado==='enviado');const calle=DB.pagos.filter(p=>p.metodo==='cobrador'&&!p.cierreId&&p.estado==='aprobado');
  let h=`<h2>Cobro a domicilio</h2>${seg('cseg',[['cierres',`Cierres (${pc.length})`],['visitas',`Visitas (${vis.length})`],['calle','En calle'],['hist','Historial']])}`;
  if(S.cseg==='cierres')h+=`<p class="note">Compara el dinero que entrega el cobrador con los recibos emitidos en la app.</p>`+(pc.map(c=>cierreCard(c,true)).join('')||empty('No hay cierres por cuadrar'));
  if(S.cseg==='visitas')h+=(cobradores().length?'':alertBox('warn','No hay cobradores','Créalos en Perfil de la residencial › Directiva y personal.',"S.rtab='equipo';go('residencial')"))+vis.map(v=>`<div class="card"><div class="row"><div class="grow"><b>${casaNom(v.casaId)}</b> <span class="sm muted">· ${esc(duenoNom(v.casaId))}</span><div class="sm muted">${fFecha(v.fecha)} · ${FRANJAS[v.franja]} · ${v.periodos.map(perC).join(', ')}</div></div><b>${money(montoVisita(v))}</b></div><label class="f" style="margin:8px 0 0">Cobrador<select onchange="asignarCob('${v.id}',this.value)"><option value="">Cualquier cobrador</option>${cobradores().map(u=>`<option value="${u.id}" ${v.cobradorId===u.id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></label></div>`).join('')||empty('Sin visitas pendientes. Los residentes las piden desde Pagos, o prográmalas desde el detalle de una casa.');
  if(S.cseg==='calle'){const g={};calle.forEach(p=>{(g[p.cobradorId]=g[p.cobradorId]||[]).push(p)});h+=`<p class="note">Dinero cobrado que todavía no tiene cierre enviado.</p>`+(Object.entries(g).map(([id,ps])=>`<div class="card"><div class="row"><b class="grow">${esc(usuario(id).nombre)}</b><b>${money(sum(ps,p=>p.monto))}</b></div>${ps.map(filaCobro).join('')}</div>`).join('')||empty('Todo el dinero cobrado ya tiene cierre'))}
  if(S.cseg==='hist')h+=DB.cierres.filter(c=>c.estado!=='enviado').map(c=>cierreCard(c,true)).join('')||empty('Sin cierres revisados');
  return h}

let XLSXp=null,IMP=null;
function cargarXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XLSXp)return XLSXp;XLSXp=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{XLSXp=null;rej(new Error('net'))};document.head.appendChild(s)});return XLSXp}
async function guardarArchivo(nombre,data){try{const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(d){await d.save({filename:nombre,data});return}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable')return toast('No se pudo descargar: '+(e.message||e.code))}
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function revisarPegado(){const t=document.getElementById('impPaste').value;if(!t.trim())return toast('Pega primero las filas');procesarFilas(textoAFilas(t))}
async function leerImport(f){if(!f)return;const prev=document.getElementById('impPrev');prev.innerHTML=empty('Leyendo archivo…');
  try{if(/\.(csv|txt)$/i.test(f.name)||f.type==='text/csv'){procesarFilas(textoAFilas(await f.text()));return}
    const X=await cargarXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];procesarFilas(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())))}
  catch(e){prev.innerHTML=alertBox('bad','No se pudo leer el archivo','Revisa que sea .xlsx o .csv. Si estás sin internet, guarda el Excel como CSV o pega las filas.')}}
const normPol=p=>{p=String(p||'').trim();if(!p)return'';return /^pol/i.test(p)?p.replace(/^pol[ií]gono/i,'Polígono'):'Polígono '+p.toUpperCase()};
const PLANT=[['Número de casa','Polígono','Apellidos de la familia','Propietario','DUI','Teléfono','Correo','Meses que debe'],['1','A','Hernández López','María Hernández','01234567-8','7000-0000','maria@correo.com','Enero 2026, Febrero 2026'],['2','A','Martínez Ruiz','José Martínez','','7111-1111','',''],['15','B','Flores Díaz','Ana Flores','','','','enero a junio 2026']];
/* --- Meses que debe: interpreta "Enero 2026", "ene-26", "01/2026", "2026-01", "enero a junio 2026", "3 meses" --- */
const MES_IDX={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,nov:11,dic:12,dec:12};
const mesNum=t=>{t=String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return t.length>=3?(MES_IDX[t.slice(0,3)]||0):0};
const anio=y=>{y=+y;return y<100?2000+y:y};
function perAuto(m){const[cy,cm]=periodoActual().split('-').map(Number);return(m<=cm?cy:cy-1)+'-'+pad(m)}
function parseMeses(s){s=String(s??'').trim();const out=new Set();let err='';if(!s||/^(0|no|ninguno|nada|al d[ií]a|solvente|-|—)$/i.test(s))return{p:[],err};const cur=periodoActual();
  const rango=(a,b)=>{let p=a,g=0;while(p<=b&&g<120){out.add(p);p=addMonths(p,1);g++}};
  s.split(/[,;\n]+|\s+y\s+/i).map(x=>x.trim().replace(/\.$/,'')).filter(Boolean).forEach(tok=>{let m;const t=tok.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(m=t.match(/^(\d+)\s*mes(es)?$/i)){const n=Math.min(120,+m[1]);for(let i=0;i<n;i++)out.add(addMonths(cur,-i))}
    else if(m=t.match(/^(\d{4})[-\/.](\d{1,2})$/))out.add(m[1]+'-'+pad(+m[2]));
    else if(m=t.match(/^(\d{1,2})[-\/.](\d{2,4})$/))out.add(anio(m[2])+'-'+pad(+m[1]));
    else if((m=t.match(/^([a-z]{3,})\.?\s*(?:a|al|hasta|-)\s*([a-z]{3,})\.?\s*(?:de\s*|del\s*)?[-\/ ]?\s*(\d{2,4})?$/i))&&mesNum(m[1])&&mesNum(m[2])){const m1=mesNum(m[1]),m2=mesNum(m[2]);const fin=m[3]?anio(m[3])+'-'+pad(m2):perAuto(m2);const y=+fin.slice(0,4);rango((m1<=m2?y:y-1)+'-'+pad(m1),fin)}
    else if((m=t.match(/^([a-z]{3,})\.?\s*(?:de\s*|del\s*)?[-\/ ]?\s*(\d{2,4})?$/i))&&mesNum(m[1]))out.add(m[2]?anio(m[2])+'-'+pad(mesNum(m[1])):perAuto(mesNum(m[1])));
    else err='No se entiende “'+tok+'”'});
  const p=[...out].filter(x=>/^\d{4}-(0[1-9]|1[0-2])$/.test(x)).sort();if(p.some(x=>x>cur))err=err||'Incluye meses futuros';return{p:p.filter(x=>x<=cur),err}}
/* aplica el estado de cuenta inicial: meses en "owed" quedan pendientes, el resto pagado */
function aplicarSaldo(c,owed){const per=periodoActual();const ini=owed.length?owed[0]:null;const start=c.desde||DB.inicioCobro;if(ini&&ini<start)c.desde=ini;ensureCuotas();
  cuotasCasa(c.id).forEach(q=>{if(q.periodo>per||q.estado==='revision')return;const debe=owed.includes(q.periodo);if(debe&&q.estado!=='pendiente'){q.estado='pendiente';q.monto=c.cuota||DB.config.cuota;q.inicial=true}else if(!debe&&q.estado==='pendiente'){q.estado='pagado';q.inicial=true}})}

  <div class="card" style="overflow-x:auto;padding:8px"><table style="border-collapse:collapse;font-size:12px;white-space:nowrap">${PLANT.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'} style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)">${esc(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>
  <p class="note">Meses que debe acepta: “Enero 2026, Febrero 2026”, “ene-26”, “01/2026”, “enero a junio 2026” o “3 meses” (los últimos 3).</p>
